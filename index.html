<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>주간계획서 현황</title>
<style id="pagecss">
/* layout: 상단 요약 카드 → 탭(도서 목록 / 작업자별 / 체크포인트 / 입고예정 / 보류) → 표. 편집 모드에서 칸을 직접 고치고 모든 접속자에게 실시간 반영 */
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2330;--sub:#5d6778;--line:#e1e5ec;--accent:#2457c5;--accent-bg:#e8effc;
--c-prog:#2457c5;--c-wait:#b7791f;--c-stock:#7a5fb0;--c-done:#2f855a;--c-step:#0f8a8a;--c-hold:#c0392b;--c-print:#8a93a3;--warn:#c0392b;--ok:#2f855a;--g1:#2e7d32;--g2:#5f7312;--g3:#c2410c;--g4:#be185d;--gx:#5b6472}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151b;--card:#1a1f28;--ink:#e6e9ef;--sub:#99a3b3;--line:#2b323f;--accent:#7ea4f2;--accent-bg:#1f2b45;
--c-prog:#7ea4f2;--c-wait:#e0b050;--c-stock:#b79df0;--c-done:#6fcf97;--c-step:#58c6c6;--c-hold:#f08a7e;--c-print:#7d8696;--warn:#f08a7e;--ok:#6fcf97;--g1:#7fd08a;--g2:#c3d86a;--g3:#fb923c;--g4:#f472b6;--gx:#a3acba;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151b;--card:#1a1f28;--ink:#e6e9ef;--sub:#99a3b3;--line:#2b323f;--accent:#7ea4f2;--accent-bg:#1f2b45;
--c-prog:#7ea4f2;--c-wait:#e0b050;--c-stock:#b79df0;--c-done:#6fcf97;--c-step:#58c6c6;--c-hold:#f08a7e;--c-print:#7d8696;--warn:#f08a7e;--ok:#6fcf97;--g1:#7fd08a;--g2:#c3d86a;--g3:#fb923c;--g4:#f472b6;--gx:#a3acba;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
header{padding:16px 0 8px;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between}
h1{margin:0;font-size:20px}
.meta{color:var(--sub);font-size:12px;margin-top:2px}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:700}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-size:12px;color:var(--sub);display:flex;gap:10px;align-items:center}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c-print);margin-right:4px}
.dot.live{background:var(--ok)}.dot.err{background:var(--warn)}
.saved.err{color:var(--warn)}
.wrap{padding:0 0 40px;max-width:1500px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.kpi:hover{border-color:var(--accent)}
.sin{color:#d62828;font-weight:700}
tr.r.locked td{background:color-mix(in srgb,var(--sub) 6%,transparent)}
.hist-link{cursor:pointer;text-decoration:underline dotted}
.hist-link:hover{color:var(--accent)}
#histBack{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:4vh 12px}
#histBack.on{display:flex}
#hist{background:var(--card);border:1px solid var(--line);border-radius:12px;width:min(980px,100%);max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
#hist .hh{display:flex;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#hist .hh h2{margin:0;font-size:16px;margin-right:auto}
#hist .hh input{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);min-width:200px}
#hist .hb{overflow:auto;padding:4px 14px 12px}
#hist table{width:100%;border-collapse:collapse;font-size:13px}
#hist th{position:sticky;top:0;background:var(--card);text-align:left;font-size:11px;color:var(--sub);padding:8px 6px;border-bottom:1px solid var(--line)}
#hist td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
#hist .vo{color:var(--sub);text-decoration:line-through}
#hist .vn{font-weight:600}
#hist .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--accent-bg);color:var(--accent)}
#hist .tag.del{background:color-mix(in srgb,var(--warn) 15%,var(--card));color:var(--warn)}
#hist .msg{padding:24px 6px;color:var(--sub);font-size:13px}
.pw{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pw+.pw{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.pwn{color:var(--sub);font-size:11px;min-width:3.4em;font-weight:600}
.grip{cursor:grab;color:var(--sub);user-select:none;margin-right:6px;font-size:13px;letter-spacing:-2px}
.grip:active{cursor:grabbing}
tr.r.dragging{opacity:.4}
tr.r.dropb td{box-shadow:inset 0 3px 0 var(--accent)}
tr.r.dropa td{box-shadow:inset 0 -3px 0 var(--accent)}
.ed-sin{color:#d62828;font-weight:700}
.recent{background:color-mix(in srgb,var(--accent) 9%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-left:4px solid var(--accent);border-radius:10px;padding:8px 12px;margin:0 0 12px;display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.recent>b{font-size:12px;color:var(--accent);align-self:center;white-space:nowrap}
.recent .ri{flex:1 1 220px;min-width:0;border:1px solid color-mix(in srgb,var(--accent) 25%,var(--line));border-radius:8px;padding:6px 10px;cursor:pointer;background:color-mix(in srgb,var(--accent) 4%,var(--card));text-align:left;font:inherit;color:var(--ink)}
.recent .ri:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card))}
.recent .ri strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent .ri span{font-size:11px;color:var(--sub)}
.recent .none{font-size:12px;color:var(--sub);align-self:center}
.kpi b{display:block;font-size:22px;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--sub)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0 12px;flex-wrap:wrap}
.tab{padding:8px 14px;border:0;background:none;color:var(--sub);font:inherit;cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:var(--accent);border-color:var(--accent);font-weight:700}
.panel{display:none}.panel.on{display:block}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.bar input[type=search],.bar select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);max-width:100%}
.bar input[type=search]{min-width:200px;flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:3px 10px;border-radius:999px;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:700}
.lbl{font-size:12px;color:var(--sub)}
.count{margin:6px 2px;color:var(--sub);font-size:12px}
.banner{display:none;margin:0 0 10px;padding:8px 12px;border:1px solid var(--accent);background:var(--accent-bg);color:var(--accent);border-radius:8px;font-size:13px}
.banner.show{display:block}
.banner.warn{border-color:var(--warn);color:var(--warn);background:var(--card)}
.tbl-wrap{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;max-height:72vh}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 9px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:var(--card);font-size:12px;color:var(--sub);cursor:pointer;white-space:nowrap;z-index:1;border-bottom:2px solid var(--line)}
th.act,td.act{display:none;cursor:default;white-space:nowrap}
body.edit th.act,body.edit td.act{display:table-cell}
tr.r td:first-child{border-left:4px solid var(--c)}
tr.r:hover td{background:var(--accent-bg)}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;color:#fff;background:var(--c);white-space:nowrap}
.sec{font-size:11px;color:var(--sub)}
.t{font-weight:600}
td.nw{white-space:nowrap}
.age{font-size:11px;color:var(--sub);white-space:nowrap}
.age.old{color:var(--warn);font-weight:700}
.w{cursor:pointer;color:var(--ink)}
.w:hover{text-decoration:underline}
.card h3 .w{font-weight:700}
body.edit [contenteditable]{outline:1px dashed var(--line);border-radius:3px;padding:1px 4px;min-width:3ch;display:inline-block;max-width:100%}
body.edit [contenteditable]:focus{outline:2px solid var(--accent);background:var(--accent-bg)}
body.edit [contenteditable]:empty::before{content:'입력';color:var(--sub)}
td select,td input[type=date]{font:inherit;font-size:12px;padding:2px 4px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);max-width:100%}
.cards{align-items:start;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.card h3{margin:0 0 6px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.card h3 small{color:var(--sub);font-weight:400}
.mini{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.item{padding:5px 0;border-top:1px dashed var(--line);font-size:13px}
.item .n{color:var(--sub);font-size:12px}
.memo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:12px}
.card ul{margin:4px 0 0;padding-left:18px}
.card li{margin:2px 0}
.empty{color:var(--sub);padding:24px;text-align:center}
.note{font-size:12px;color:var(--sub);margin-top:14px;line-height:1.6}
.printhead{display:none}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw}
#toast.show{opacity:1}

.wgroup{margin-bottom:22px}
.g1{--g:var(--g1)}.g2{--g:var(--g2)}.g3{--g:var(--g3)}.g4{--g:var(--g4)}.gx{--g:var(--gx)}
.wgroup h2{font-size:16px;margin:20px 0 12px;padding:8px 12px;border-left:6px solid var(--g);background:color-mix(in srgb,var(--g) 13%,var(--card));border-radius:6px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.wgroup .card{border-top:3px solid var(--g)}
.wgroup .card.idle{border-top:3px dashed var(--g)}
.wgroup h2 small{color:var(--sub);font-weight:400;font-size:12px}
.card h3 .hr{display:flex;gap:8px;align-items:center}
.stbtn{font:inherit;font-size:11px;font-weight:700;cursor:pointer;color:var(--c);background:transparent;border:0;box-shadow:inset 0 0 0 1.5px var(--c);padding:1px 9px;border-radius:999px;display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.stbtn::before{content:'▸';font-size:10px}
.stbtn[aria-expanded="true"]{background:var(--c);color:#fff}
.stbtn[aria-expanded="true"]::before{content:'▾'}
.stbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wstage{display:none;margin-top:2px}.wstage.open{display:block}
.wstage .shead{font-size:11px;color:var(--sub);margin:6px 0 0}
.card.idle{background:transparent;border-style:dashed}
.card.idle .lbl{padding:2px 0}
@page{size:A4 landscape;margin:10mm}
@media print{
  :root:root:root{--bg:#fff;--card:#fff;--ink:#000;--sub:#444;--line:#bbb;--accent:#1b3f94;--accent-bg:#fff;--c-prog:#2457c5;--c-wait:#b7791f;--c-stock:#7a5fb0;--c-done:#2f855a;--c-step:#0f8a8a;--c-hold:#c0392b;--c-print:#8a93a3;--warn:#c0392b;--g1:#2e7d32;--g2:#5f7312;--g3:#c2410c;--g4:#be185d;--gx:#5b6472}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{font-size:10px;background:#fff;padding:0}
  header,.kpis,.tabs,.bar,.banner,.note,.no-print,.act,#toast,#histBack{display:none!important}
  .wrap{padding:0;max-width:none}
  .panel{display:none!important}.panel.on{display:block!important}
  .printhead{display:block;margin-bottom:6px}
  .printhead h1{font-size:15px}
  .tbl-wrap{max-height:none;overflow:visible;border:0}
  th{position:static;cursor:default}
  tr{break-inside:avoid}
  th,td{padding:3px 5px}
  tr.r:hover td{background:none}
  .cards,.memo-grid{display:block;column-count:2;column-gap:10px}
  .card{break-inside:avoid;margin-bottom:8px}
  .w{color:inherit}
  .wstage{display:block!important}
  .stbtn{box-shadow:none;background:var(--c);color:#fff}
  .stbtn::before{content:''}
  .wgroup{break-inside:auto}
}
</style>
</head>
<body>


<header class="no-print">
  <div>
    <h1 id="ttl">주간계획서</h1>
  </div>
  <div class="tools">
    <div class="status"><span><i class="dot" id="dot"></i><span id="conn">연결 중…</span></span><span class="saved" id="saved"></span></div>
    <button class="btn primary" id="bAddTop" hidden>+ 도서 추가</button>
    <button class="btn" id="bEdit" hidden>편집 모드</button>
    <button class="btn primary" id="bPrint">인쇄용 파일 저장</button>
    <button class="btn" id="bHist">변경 이력</button>
    <button class="btn" id="bCsv">CSV 저장</button>
  </div>
</header>
<div class="wrap">
  <div class="printhead"><h1 id="pTtl"></h1><div class="meta" id="pMeta"></div></div>
  <div class="banner" id="roBanner">보기 전용입니다. 수정하려면 소유자에게 수정 권한(Contributor 이상)을 요청하세요.</div>
  <div class="banner" id="editBanner">편집 모드입니다. 칸을 눌러 고치면 잠시 뒤 모든 접속자의 화면에 반영됩니다. 작업자는 "이름 / 이름" 형식으로 적습니다.</div>
  <div class="kpis" id="kpis"></div>
  <div class="recent no-print" id="recent"></div>
  <div class="tabs" id="tabs"></div>

  <section class="panel" id="p-list">
    <div class="bar">
      <input type="search" id="q" placeholder="도서명·저자·작업자·진행내용 검색" aria-label="검색">
      <select id="fSec" aria-label="구분"></select>
      <select id="fKind" aria-label="신간·개정"><option value="">신간+개정</option><option>신간</option><option>개정</option></select>
      <select id="fWorker" aria-label="작업자"></select>
      <label class="lbl">정체 기준 <select id="thr"><option value="7">7일</option><option value="14" selected>14일</option><option value="30">30일</option></select></label>
      <label class="lbl"><input type="checkbox" id="hidePrint" checked> 인쇄완료 숨기기</label>
      <label class="lbl"><input type="checkbox" id="onlyStale"> 정체만</label>
      <button class="chip" id="reset">초기화</button>
      <button class="btn primary" id="bAdd" hidden>+ 도서 추가</button>
    </div>
    <div class="bar" style="padding:6px 10px"><span class="lbl">단계</span><div class="chips" id="stageChips"></div></div>
    <div class="count"><span id="count"></span> <button type="button" class="chip no-print" id="bMyOrder" hidden>내 순서로 보기</button></div>
    <div class="tbl-wrap"><table>
      <thead><tr>
        <th data-k="sec">구분</th><th data-k="title">도서명</th><th data-k="rev">차수</th><th data-k="author">저자</th>
        <th data-k="workers">작업자</th><th data-k="stage">단계</th><th data-k="date">최종 갱신</th><th>진행 내용</th><th class="act">삭제</th>
      </tr></thead>
      <tbody id="tb"></tbody>
    </table></div>
  </section>

  <section class="panel" id="p-worker">
    <div class="bar no-print"><span class="lbl">단계 버튼을 누르면 해당 작업이 펼쳐지고, 다시 누르면 접힙니다.</span><button class="chip" id="wOpen">모두 펼치기</button><button class="chip" id="wClose">모두 접기</button></div>
    <div id="wcards"></div></section>
  <section class="panel" id="p-memo"><div class="memo-grid" id="memo"></div></section>
  <section class="panel" id="p-incoming">
    <div class="bar no-print" id="incBar" hidden><button class="btn primary" id="bIncAdd">+ 입고예정 추가</button></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>입고(예정)일</th><th>도서명</th><th>저자</th><th>현재 진행</th><th>차수</th><th class="act">삭제</th></tr></thead><tbody id="inc"></tbody></table></div></section>
  <section class="panel" id="p-hold"><div class="memo-grid" id="hold"></div></section>

</div>
<div id="toast" role="status"></div>
<div id="histBack" class="no-print"><div id="hist" role="dialog" aria-label="변경 이력">
  <div class="hh"><h2>변경 이력</h2><input type="search" id="histQ" placeholder="도서명·수정한 사람·칸 검색"><button class="btn" id="histReload">새로고침</button><button class="btn" id="histClose">닫기</button></div>
  <div class="hb" id="histBody"></div></div></div>


<script>
/* Supabase 연동 계층: 화면 코드가 쓰는 db/user/downloads 인터페이스를 Supabase RPC + 주기적 갱신으로 구현 */
(function(){
const URL_='https://vqnsffkqljnhcxtwqkxx.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxbnNmZmtxbGpuaGN4dHdxa3h4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NzA2NDIsImV4cCI6MjEwOTE0NjY0Mn0.hZYPvkiD96WZbeoQ-1GNiXtfxTJn0FVdrsaGSo4j78A';
const POLL=window.JP_POLL_MS||4000;
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
let PW=ls.get('jp-pw')||'',NAME=ls.get('jp-name')||'';

async function rpc(fn,args){
  let r;
  try{r=await fetch(URL_+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(args)})}
  catch(e){throw {code:'network',message:String(e)}}
  const t=await r.text();let j=null;try{j=JSON.parse(t)}catch(e){}
  if(!r.ok){const m=(j&&(j.message||j.error))||t;throw {code:/bad_password/.test(m)?'bad_password':'error',message:m}}
  return j}

/* ---------- 로그인 ---------- */
const css=document.createElement('style');
css.textContent=`#jpLogin{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
#jpLogin form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;width:min(360px,100%);display:flex;flex-direction:column;gap:10px}
#jpLogin h2{margin:0 0 4px;font-size:18px}#jpLogin p{margin:0;color:var(--sub);font-size:12px}
#jpLogin input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
#jpLogin .err{color:var(--warn);font-size:12px;min-height:1.2em}`;
document.head.appendChild(css);
function askLogin(msg){return new Promise(res=>{
  const d=document.createElement('div');d.id='jpLogin';
  d.innerHTML=`<form><h2>주간계획서 현황</h2><p>팀 공유 비밀번호와 본인 이름을 입력하세요. 이름은 "수정한 사람"으로 기록됩니다.</p>
  <input id="jpName" placeholder="이름 (예: 김지혜)" autocomplete="name" value="${(NAME||'').replace(/"/g,'&quot;')}">
  <input id="jpPw" type="password" placeholder="공유 비밀번호" autocomplete="current-password">
  <div class="err" id="jpErr">${msg||''}</div><button class="btn primary" type="submit">들어가기</button></form>`;
  document.body.appendChild(d);
  const f=d.querySelector('form');
  f.onsubmit=async e=>{e.preventDefault();const n=d.querySelector('#jpName').value.trim(),p=d.querySelector('#jpPw').value;
    if(!n||!p){d.querySelector('#jpErr').textContent='이름과 비밀번호를 모두 입력하세요.';return}
    d.querySelector('#jpErr').textContent='확인 중…';
    try{await rpc('jp_check',{pw:p});PW=p;NAME=n;ls.set('jp-pw',p);ls.set('jp-name',n);d.remove();res()}
    catch(x){d.querySelector('#jpErr').textContent=x.code==='bad_password'?'비밀번호가 맞지 않습니다.':'서버에 연결하지 못했습니다. 잠시 뒤 다시 시도하세요.'}};
  setTimeout(()=>d.querySelector(NAME?'#jpPw':'#jpName').focus(),50)})}
async function ensureLogin(){
  if(PW&&NAME){try{await rpc('jp_check',{pw:PW});return}catch(x){if(x.code!=='bad_password')return;ls.del('jp-pw');PW=''}}
  await askLogin(PW?'':'')}
function addAccountButtons(){
  const t=document.querySelector('.tools');if(!t||document.getElementById('jpAcct'))return;
  const w=document.createElement('span');w.id='jpAcct';w.style.display='contents';
  w.innerHTML='<button class="btn" id="jpPwBtn">비밀번호 변경</button><button class="btn" id="jpOut">로그아웃</button>';
  t.appendChild(w);
  document.getElementById('jpOut').onclick=()=>{ls.del('jp-pw');location.reload()};
  document.getElementById('jpPwBtn').onclick=async()=>{
    const n=prompt('새 공유 비밀번호 (6자 이상). 바꾸면 팀원 모두 새 비밀번호로 다시 들어와야 합니다.');if(!n)return;
    try{await rpc('jp_set_password',{old_pw:PW,new_pw:n});PW=n;ls.set('jp-pw',n);alert('비밀번호를 바꿨습니다. 팀원에게 새 비밀번호를 알려 주세요.')}
    catch(x){alert('바꾸지 못했습니다: '+(x.message||''))}}}

/* ---------- 캐시 + 구독 ---------- */
const C={books:new Map(),incoming:new Map(),memo:new Map(),hold:new Map(),meta:new Map()};
const subs=[];let ready=false,since='1970-01-01T00:00:00Z',maxTs='';
const mkDoc=(id,data)=>({id,exists:!!data,data:()=>data,metadata:{fromCache:false,hasPendingWrites:false}});
function live(c){return [...C[c]].filter(([,v])=>!v.deleted)}
function emit(c){subs.filter(s=>s.c===c).forEach(s=>{
  const cur=new Map(live(c).map(([id,v])=>[id,JSON.stringify(v.data)]));const ch=[];
  for(const [id,j] of cur){if(!s.sent.has(id))ch.push({type:'added',doc:mkDoc(id,JSON.parse(j))});else if(s.sent.get(id)!==j)ch.push({type:'modified',doc:mkDoc(id,JSON.parse(j))})}
  for(const [id] of s.sent)if(!cur.has(id))ch.push({type:'removed',doc:mkDoc(id,{})});
  if(!ch.length&&s.first===false)return;
  s.sent=cur;s.first=false;
  try{s.next({docChanges:()=>ch,metadata:{fromCache:false,hasPendingWrites:false},docs:[],size:cur.size,empty:!cur.size})}catch(e){console.error(e)}})}
function applyRows(rows){const touched=new Set();
  rows.forEach(r=>{C[r.coll]&&(C[r.coll].set(r.id,{data:r.data||{},deleted:!!r.deleted}),touched.add(r.coll));
    if(r.updated_at&&r.updated_at>maxTs)maxTs=r.updated_at});
  if(maxTs){const d=new Date(maxTs);d.setSeconds(d.getSeconds()-3);since=d.toISOString()}
  return touched}
function setConn(ok){const d=document.getElementById('dot'),c=document.getElementById('conn');if(!d||!c)return;
  d.className='dot '+(ok?'live':'err');c.textContent=ok?'실시간 연결됨':'연결 재시도 중…'}
let pollT=null;
async function poll(){
  clearTimeout(pollT);
  try{const rows=await rpc('jp_pull',{pw:PW,since});const t=applyRows(rows||[]);setConn(true);
    if(!ready){ready=true;Object.keys(C).forEach(emit)}else t.forEach(emit)}
  catch(e){if(e.code==='bad_password'){ls.del('jp-pw');location.reload();return}setConn(false)}
  pollT=setTimeout(poll,document.hidden?15000:POLL)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ready){clearTimeout(pollT);poll()}});

function colRef(c){return {onSnapshot(next){const s={c,next,sent:new Map(),first:true};subs.push(s);if(ready)setTimeout(()=>emit(c),0);return()=>{const i=subs.indexOf(s);if(i>=0)subs.splice(i,1)}}}}
function docRef(path){const [c,id]=path.split('/');
  const write=async patch=>{await rpc('jp_patch',{pw:PW,p_coll:c,p_id:id,p_patch:patch});
    const cur=C[c].get(id);C[c].set(id,{data:Object.assign({},cur&&!cur.deleted?cur.data:{},JSON.parse(JSON.stringify(patch))),deleted:false});emit(c)};
  return {update:write,set:write,
    async delete(){
      try{await rpc('jp_delete',{pw:PW,p_coll:c,p_id:id,p_by:NAME})}
      catch(x){if(/Could not find the function/i.test(x&&x.message||'')){await rpc('jp_delete',{pw:PW,p_coll:c,p_id:id})}else throw x}
      const cur=C[c].get(id);if(cur){cur.deleted=true}emit(c)},
    onSnapshot(next){const s={c,sent:new Map(),first:true,next:snap=>{const d=snap.docs.length?null:null;
        const v=C[c].get(id);next(mkDoc(id,v&&!v.deleted?v.data:undefined))}};
      s.next=()=>{const v=C[c].get(id);next(mkDoc(id,v&&!v.deleted?v.data:undefined))};
      const st=JSON.stringify;let last='\u0000';
      const sub={c,sent:new Map(),first:true,next:()=>{const v=C[c].get(id);const cur=v&&!v.deleted?st(v.data):'';if(cur!==last){last=cur;next(mkDoc(id,v&&!v.deleted?v.data:undefined))}}};
      subs.push(sub);if(ready)setTimeout(()=>emit(c),0);return()=>{const i=subs.indexOf(sub);if(i>=0)subs.splice(i,1)}}}}
const db={collection:colRef,doc:docRef};
const userCap={id:async()=>NAME,can:async()=>true,isOwner:async()=>false,canEdit:async()=>true,
  profiles:async ids=>Object.fromEntries(ids.map(i=>[i,{id:i,name:i}])),me:async()=>({id:NAME,name:NAME})};
const dlCap={async save({filename,data}){const b=new Blob([data],{type:/\.csv$/.test(filename)?'text/csv;charset=utf-8':'text/html'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);return{status:'saved'}}};

let started=null;
function start(){if(!started){started=(async()=>{await ensureLogin();addAccountButtons();poll()})()}return started}
window.JPX={hist:(limit,before)=>rpc('jp_hist',{pw:PW,p_limit:limit||200,p_before:before||null}),
  noHist:x=>/Could not find the function/i.test(x&&x.message||'')};
window.claude={use:async n=>{await start();return n==='db'?db:n==='user'?userCap:n==='downloads'?dlCap:null}};
})();

</script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STAGE={'진행중':'--c-prog','대기':'--c-wait','재고대기':'--c-stock','단계완료':'--c-step','보류':'--c-hold','인쇄완료':'--c-print'};
const ORDER=['진행중','대기','단계완료','재고대기','보류','인쇄완료'];
const ORG=[
 ['출판1부',['차인태','신보용','권윤주','김지혜','김진영','박온누리','윤소연','백혜림','정지연','임한나','김예민'],'g1'],
 ['출판1부 한글편집팀',['유은아','김우진','이혜숙'],'g2'],
 ['출판2부',['이미향','김희현'],'g3'],
 ['디자인부',['이연주','김진혜','강현희','박지은','정은진','방지예'],'g4']];
const ORG_KNOWN=new Set(ORG.flatMap(g=>g[1]));
/* 수정 권한: 관리자는 전부, 그 외는 작업자에 본인 이름이 있는 도서만 (작업자가 비어 있는 도서는 누구나) */
const ADMINS=['차인태'];
const SECS_DEFAULT=['진행 도서 · 개정','진행 도서 · 신간','권오수 선생님 모음','인천대산전기학원','환경'];
const col=s=>`var(${STAGE[s]||'--c-prog'})`;
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const hm=ms=>{const d=new Date(ms);return String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const ageOf=s=>s?Math.round((TODAY-new Date(s+'T00:00:00'))/864e5):null;
function autoStage(t){t=t||'';if(/인쇄\s?넘김/.test(t))return'인쇄완료';if(t.includes('보류'))return'보류';
  if(t.includes('재고')&&t.includes('대기'))return'재고대기';if(t.includes('대기'))return'대기';
  if(/중|中/.test(t))return'진행중';if(t.includes('완료'))return'단계완료';return'진행중'}
const kindOf=r=>{const v=(r.rev||'').replace(/[()\s]/g,'');return((r.sec||'').includes('신간')||v==='신'||v==='新'||v==='신간')?'신간':'개정'};

const SIN=/\((?:신|新)\)/g;
const revH=v=>esc(v).replace(SIN,'(<span class="sin">新</span>)');
const revT=v=>String(v??'').replace(SIN,'(新)');
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

/* ---------- 상태 ---------- */
let db=null,userCap=null,dlCap=null,myId=null,canWrite=false;
const M={books:new Map(),incoming:new Map(),memo:new Map(),hold:new Map(),meta:null};
const loaded={books:false,incoming:false,memo:false,hold:false,meta:false};
const st={q:'',sec:'',kind:'',worker:lsGet('jp-worker')||'',thr:14,hidePrint:true,onlyStale:false,edit:false,stages:new Set(),sort:{k:'stage',dir:1},sortTouched:false};
let curTab='list';
const list=c=>[...M[c].values()].sort((a,b)=>(a.order??1e9)-(b.order??1e9));
const recs=()=>list('books');
const isStale=v=>v.age!=null&&v.age>=st.thr&&['진행중','대기','단계완료'].includes(v.stage);
/* 담당자별 진행 상황: 진행내용(pn_)·단계(ps_)·갱신일(pd_)·단계수동(pm_) 을 이름별로 따로 저장. 없으면 도서 공통값(note/stage/date)을 씀 */
const isAdmin=()=>ADMINS.includes(myId);
const mayBook=r=>canWrite&&(isAdmin()||!(r.workers||[]).length||(r.workers||[]).includes(myId));
const mayWorker=(r,w)=>canWrite&&(isAdmin()||(w?w===myId:mayBook(r)));
const pk=(w,f)=>'p'+f+'_'+w;
function eff(r,w){const g=(f,b)=>(w&&r[pk(w,f)]!==undefined)?r[pk(w,f)]:b;
  const date=g('d',r.date);return {note:g('n',r.note),stage:g('s',r.stage),date,manual:g('m',r.stageManual),age:ageOf(date)}}
function aggr(r){const ws=r.workers||[];if(ws.length<2)return eff(r,ws[0]||'');
  const es=ws.map(w=>eff(r,w));
  const stage=es.map(e=>e.stage).sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b))[0];
  const date=es.map(e=>e.date||'').sort().pop()||r.date;
  const same=es.every(e=>e.note===es[0].note);
  return {note:same?es[0].note:es.map((e,i)=>ws[i]+': '+(e.note||'-')).join(' / '),stage,date,age:ageOf(date),manual:false}}
const AG=r=>aggr(r);
const V=r=>st.worker&&(r.workers||[]).includes(st.worker)?eff(r,st.worker):aggr(r);
const wsOf=r=>st.worker?[st.worker]:((r.workers||[]).length?r.workers:['']);
function setF(r,w,vals){const personal=w&&((r.workers||[]).length>1||['n','s','d','m'].some(f=>r[pk(w,f)]!==undefined));
  const map={note:['n','note'],stage:['s','stage'],date:['d','date'],manual:['m','stageManual']};const fields=[];
  for(const k in vals){const key=personal?pk(w,map[k][0]):map[k][1];r[key]=vals[k];fields.push(key)}return fields}
const noteAll=r=>[r.note,...(r.workers||[]).map(w=>r[pk(w,'n')])].filter(Boolean).join(' ');
const mmdd=s=>s?s.slice(2).replace(/-/g,'.'):'-';
const ageTxt=v=>{if(v.age==null)return '<span class="age">상시</span>';
  return `<span class="${isStale(v)?'age old':'age'}">${mmdd(v.date)} · ${v.age}일 전</span>`};
const secShort=s=>(s||'').replace('진행 도서 · ','진행·');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),3500)}
function setSaved(msg,err){const e=$('#saved');e.textContent=msg;e.classList.toggle('err',!!err)}
const clone=v=>JSON.parse(JSON.stringify(v));

/* ---------- 쓰기 (필드 단위 저장, 문서당 한 번에 하나) ---------- */
function mark(coll,rec,fields){fields.forEach(f=>rec._d.add(f));clearTimeout(rec._t);setSaved('저장 중…');rec._t=setTimeout(()=>flush(coll,rec),600)}
async function flush(coll,rec){
  if(!db||!rec._d.size)return;
  if(rec._busy){rec._again=true;return}
  rec._busy=true;const f=[...rec._d];rec._d.clear();
  const patch={};f.forEach(k=>patch[k]=clone(rec[k]===undefined?'':rec[k]));
  const onlyOrd=f.every(k=>k.startsWith('wo_'));
  if(!onlyOrd){if(myId){patch.by=myId}patch.at=Date.now()}
  let failed=false;
  try{await db.doc(coll+'/'+rec.id).update(patch);if(!onlyOrd){rec.by=patch.by;rec.at=patch.at;renderRecent()}
    const n=new Date();setSaved('저장됨 '+String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'))}
  catch(e){failed=true;f.forEach(k=>rec._d.add(k));
    setSaved('저장 실패',true);
    toast(e&&e.code==='invalid_argument'?'저장하지 못했습니다. 다른 사람이 삭제했거나 수정 권한이 없습니다.':'저장하지 못했습니다. 잠시 뒤 다시 수정해 주세요.')}
  finally{rec._busy=false;if(!failed&&(rec._again||rec._d.size)){rec._again=false;mark(coll,rec,[])}}
}
async function createDoc(coll,data){
  const id=(coll[0])+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  const rec={id,...data,_d:new Set()};M[coll].set(id,rec);
  const body={...data};if(myId)body.by=myId;body.at=Date.now();
  try{await db.doc(coll+'/'+id).set(body)}catch(e){M[coll].delete(id);toast('추가하지 못했습니다. 수정 권한을 확인해 주세요.');requestRender(true);return null}
  return rec}
async function removeDoc(coll,id){
  const rec=M[coll].get(id);M[coll].delete(id);requestRender(true);
  try{await db.doc(coll+'/'+id).delete()}catch(e){if(rec)M[coll].set(id,rec);toast('삭제하지 못했습니다.');requestRender(true)}}

/* ---------- 구독 ---------- */
function ingest(coll,snap){
  snap.docChanges().forEach(ch=>{const id=ch.doc.id;
    if(ch.type==='removed'){M[coll].delete(id);return}
    const data=ch.doc.data()||{};let rec=M[coll].get(id);
    if(!rec){rec={id,_d:new Set()};M[coll].set(id,rec)}
    for(const k in data){if(!rec._d.has(k))rec[k]=(typeof data[k]==='object'&&data[k])?clone(data[k]):data[k]}
  });
  loaded[coll]=true;
}
let connTimer=null,liveOk=false;
function setConn(kind,txt){$('#dot').className='dot '+(kind||'');$('#conn').textContent=txt}
function subscribe(){
  connTimer=setTimeout(()=>{if(!liveOk)setConn('err','서버에 연결하지 못했습니다. 보이는 내용이 최신이 아닐 수 있습니다')},10000);
  ['books','incoming','memo','hold'].forEach(c=>{
    db.collection(c).onSnapshot(snap=>{ingest(c,snap);
      if(!snap.metadata.fromCache){liveOk=true;clearTimeout(connTimer);setConn('live','실시간 연결됨')}
      requestRender()},
      err=>{setConn('err',err&&err.code==='revoked'?'접근 권한이 변경되었습니다':'연결 오류');toast('실시간 연결이 끊겼습니다. 페이지를 새로 열어 주세요.')})});
  db.doc('meta/main').onSnapshot(s=>{if(s.exists){const d=s.data();if(!M.meta)M.meta={id:'main',_d:new Set()};if(!M.meta._t)M.meta.title=d.title;M.meta.source=d.source}loaded.meta=true;requestRender()},()=>{});
}

/* ---------- 렌더 제어 (입력 중에는 미룸) ---------- */
let rq=null,pending=false;
let dragId=null;
const typing=()=>{if(dragId)return true;const a=document.activeElement;return st.edit&&a&&a.matches&&a.matches('[contenteditable],input,select')};
function requestRender(force){
  if(!force&&typing()){pending=true;return}
  cancelAnimationFrame(rq);rq=requestAnimationFrame(()=>{pending=false;drawSelects();render();renderMisc();if(curTab==='worker')renderWorkers();drawTitle()})}
document.addEventListener('focusout',()=>{if(pending)setTimeout(()=>{if(pending&&!typing())requestRender(true)},250)});

/* ---------- 탭/컨트롤 ---------- */
const TABS=[['list','도서 목록'],['worker','작업자별'],['memo','이번주 체크포인트'],['incoming','원고 입고예정'],['hold','보류·인쇄대기']];
function drawTabs(){$('#tabs').innerHTML=TABS.map(([k,n])=>`<button class="tab${k===curTab?' on':''}" data-t="${k}">${n}${k==='incoming'?' ('+M.incoming.size+')':''}</button>`).join('')}
function showTab(k){curTab=k;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===k));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+k));
  if(k==='worker')renderWorkers();try{history.replaceState(null,'','#'+k)}catch(e){}}
$('#tabs').onclick=e=>{const b=e.target.closest('.tab');if(b)showTab(b.dataset.t)};
let wnames=[];
function drawSelects(){
  const rs=recs();
  const secs=[...new Set([...SECS_DEFAULT,...rs.map(r=>r.sec).filter(Boolean)])];
  $('#fSec').innerHTML='<option value="">전체 구분</option>'+secs.map(s=>`<option>${esc(s)}</option>`).join('');
  $('#fSec').value=secs.includes(st.sec)?st.sec:'';
  const wc={};rs.forEach(r=>(r.workers||[]).forEach(w=>wc[w]=(wc[w]||0)+1));
  wnames=Object.keys(wc).sort((a,b)=>wc[b]-wc[a]||a.localeCompare(b,'ko'));
  {const opt=w=>`<option value="${esc(w)}">${esc(w)} (${wc[w]})</option>`;
   let h='<option value="">전체 작업자</option>';
   ORG.forEach(([n,m])=>{const ms=m.filter(w=>wc[w]);if(ms.length)h+=`<optgroup label="${esc(n)}">${ms.map(opt).join('')}</optgroup>`});

const itemText=it=>it==null?'':typeof it==='string'?it:[it.label&&'['+it.label+']',it.date,it.text].filter(Boolean).join(' ');
function fmtVal(v){if(v===null||v===undefined||v==='')return '(비어 있음)';

  if(typeof v==='object')return JSON.stringify(v);return String(v)}
function diffVals(o,n){
  if(Array.isArray(o)&&Array.isArray(n)&&((o.length&&typeof o[0]==='object')||(n.length&&typeof n[0]==='object'))){
    const L=Math.max(o.length,n.length);
    for(let i=0;i<L;i++)if(JSON.stringify(o[i])!==JSON.stringify(n[i]))return [itemText(o[i])||'(비어 있음)',itemText(n[i])||'(비어 있음)'];

        <td class="nw"><span class="tag${k==='__delete'?' del':''}">${esc(fieldLabel(k))}</span></td><td>${chg}</td>
        <td class="nw">${canRestore(h)?`<button class="chip" data-restore="${h.id}">되돌리기</button>`:''}</td></tr>`}).join('')}</tbody></table>`;
  if(!H.err&&H.more&&H.rows.length)html+=`<div style="text-align:center;padding:10px"><button class="btn" id="histMore">${H.busy?'불러오는 중…':'이전 이력 더 보기'}</button></div>`;
  if(H.busy&&!H.rows.length)html='<div class="msg">불러오는 중…</div>';
  $('#histBody').innerHTML=html}
async function loadHist(reset){
  if(H.busy||!window.JPX)return;H.busy=true;if(reset){H.rows=[];H.more=true;H.err=''}
  drawHist();
  const before=H.rows.length?H.rows[H.rows.length-1].id:null;
  try{const r=await window.JPX.hist(200,before);H.rows.push(...r);H.more=r.length>=200;H.err=''}
  catch(e){H.err=window.JPX.noHist(e)?'이력 기능이 아직 켜지지 않았습니다. Supabase의 SQL Editor에서 "supabase_이력_추가.sql"을 한 번 실행해 주세요.':'이력을 불러오지 못했습니다. 잠시 뒤 다시 시도해 주세요.'}
  H.busy=false;drawHist()}
function openHist(q){$('#histQ').value=q||'';$('#histBack').classList.add('on');
  if(!window.JPX){H.err='이 화면에서는 변경 이력을 쓸 수 없습니다.';drawHist();return}
  loadHist(true)}
function closeHist(){$('#histBack').classList.remove('on')}
$('#bHist').onclick=()=>openHist('');
$('#histClose').onclick=closeHist;$('#histReload').onclick=()=>loadHist(true);
$('#histBack').addEventListener('click',e=>{if(e.target.id==='histBack')closeHist()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeHist()});
$('#histQ').oninput=drawHist;
document.addEventListener('click',e=>{const h=e.target.closest('[data-hist]');if(h){openHist(h.dataset.hist)}});
$('#histBody').addEventListener('click',async e=>{
  if(e.target.id==='histMore'){loadHist(false);return}
  const b=e.target.closest('[data-restore]');if(!b)return;
  const h=H.rows.find(x=>String(x.id)===b.dataset.restore);if(!h||!canRestore(h))return;
  const what=h.field==='__delete'?'삭제된 "'+(h.doc_title||'')+'" 을(를) 복원':'"'+(h.doc_title||'')+'"의 '+fieldLabel(h.field)+' 을(를) 이전 값으로 되돌리';
  if(!confirm(what+'할까요? 현재 값은 이력에 남습니다.'))return;
  b.disabled=true;
  try{const d=db.doc(h.coll+'/'+h.doc_id);
    if(h.field==='__delete')await d.set({...h.old_val,by:myId,at:Date.now()});
    else await d.update({[h.field]:h.old_val,by:myId,at:Date.now()});
    toast('되돌렸습니다');loadHist(true)}
  catch(x){toast('되돌리지 못했습니다');b.disabled=false}});
async function addBook(workers){
  if(!canWrite){toast('수정 권한이 없습니다');return}
  let me=(workers&&workers[0])||st.worker||'';
  if(!isAdmin()&&myId){if(me&&me!==myId){toast('본인 이름의 카드에서만 도서를 추가할 수 있습니다');return}me=myId}
  resetFilters();
  if(me){workers=[me];st.worker=me;lsSet('jp-worker',me)}
  if(!st.edit)setEdit(true);
  showTab('list');
  const mx=Math.max(0,...recs().map(r=>r.order||0));
  const rec=await createDoc('books',{sec:'진행 도서 · 개정',title:'새 도서',rev:'',author:'',workers:workers||[],date:iso(TODAY),note:'',kind:'개정',stage:'진행중',extra:'',order:mx+1});
  if(!rec)return;rec._new=1;
  await new Promise(r=>setTimeout(r,160));drawSelects();$('#fWorker').value=st.worker;render();
  const el=tb.querySelector(`[data-f=title][data-id="${rec.id}"]`);if(el){el.scrollIntoView({block:'center'});el.focus();document.getSelection().selectAllChildren(el)}}
$('#bAdd').onclick=()=>addBook([]);
$('#bAddTop').onclick=()=>addBook([]);
document.addEventListener('click',e=>{const b=e.target.closest('[data-addfor]');if(b)addBook([b.dataset.addfor])});

/* ---------- 작업자별 / 체크포인트 / 입고예정 / 보류 ---------- */
const WSTAGES=['진행중','대기','단계완료','재고대기','보류'];
const openSet=new Set();
function htmlWorkers(all){
  const byW={};
  recs().forEach(r=>{(r.workers||[]).forEach(w=>{if(eff(r,w).stage==='인쇄완료')return;(byW[w]=byW[w]||[]).push(r)})});
  const others=Object.keys(byW).filter(w=>!ORG_KNOWN.has(w)).sort((a,b)=>byW[b].length-byW[a].length||a.localeCompare(b,'ko'));
  const groups=[...ORG,['기타 (외주·미분류)',others,'gx']];
  const card=w=>{
    const mine=(byW[w]||[]);
    if(!mine.length)return `<div class="card idle"><h3><span class="w" data-w="${esc(w)}">${esc(w)}</span><span class="hr"><small>작업 0건</small> ${(!all&&canWrite&&(isAdmin()||w===myId))?`<button type="button" class="chip no-print" data-addfor="${esc(w)}">+ 도서</button>`:''}</span></h3><div class="lbl">진행 중인 작업이 없습니다</div></div>`;
    const by={};mine.forEach(r=>{const g=eff(r,w).stage;(by[g]=by[g]||[]).push(r)});
    const stages=WSTAGES.filter(x=>by[x]);
    const open=x=>all||openSet.has(w+'|'+x);
    return `<div class="card"><h3><span class="w" data-w="${esc(w)}">${esc(w)}</span><span class="hr"><small>작업 ${mine.length}건</small> ${(!all&&canWrite&&(isAdmin()||w===myId))?`<button type="button" class="chip no-print" data-addfor="${esc(w)}">+ 도서</button>`:''}</span></h3>
      <div class="mini">${stages.map(x=>`<button type="button" class="stbtn" style="--c:${col(x)}" data-tog="${esc(w+'|'+x)}" aria-expanded="${open(x)}">${x} ${by[x].length}</button>`).join('')}</div>
      ${stages.map(x=>`<div class="wstage${open(x)?' open':''}" data-k="${esc(w+'|'+x)}"><div class="shead">${x}</div>${by[x].sort((a,b)=>(eff(a,w).date||'9999')<(eff(b,w).date||'9999')?-1:1).map(r=>{const v=eff(r,w);return `<div class="item"><b>${esc(r.title)}</b> ${revH(r.rev)}
        <div class="n">${esc(v.note)} · ${ageTxt(v)}</div></div>`}).join('')}</div>`).join('')}</div>`};
  const html=groups.map(([n,members,gc])=>{
    if(!members.length)return '';
    const tot=members.reduce((t,w)=>t+(byW[w]||[]).length,0);
    return `<section class="wgroup ${gc}"><h2>${esc(n)} <small>${members.length}명 · 작업 ${tot}건</small></h2><div class="cards">${members.map(card).join('')}</div></section>`}).join('');
  return html||'<div class="empty">표시할 작업이 없습니다</div>'}
function renderWorkers(){$('#wcards').innerHTML=htmlWorkers()}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-tog]');
  if(b){const k=b.dataset.tog,card=b.closest('.card');const on=!openSet.has(k);on?openSet.add(k):openSet.delete(k);
    b.setAttribute('aria-expanded',on);const p=[...card.querySelectorAll('.wstage')].find(x=>x.dataset.k===k);if(p)p.classList.toggle('open',on);return}
  if(e.target.id==='wOpen'){document.querySelectorAll('#wcards .stbtn').forEach(x=>openSet.add(x.dataset.tog));renderWorkers();return}
  if(e.target.id==='wClose'){openSet.clear();renderWorkers()}});
const E=()=>st.edit?' contenteditable="plaintext-only"':'';
function htmlMemo(){return list('memo').map(g=>{
    const subs={};(g.items||[]).forEach((it,ji)=>(subs[it.label||'']=subs[it.label||'']||[]).push([ji,it.text]));
    return `<div class="card"><h3>${esc(g.title)}</h3>${Object.entries(subs).map(([l,xs])=>`${l?`<div class="lbl">[${esc(l)}]</div>`:''}<ul>${xs.map(([ji,x])=>`<li><span${E()} data-m="memo" data-g="${esc(g.id)}" data-j="${ji}">${esc(x)}</span></li>`).join('')}</ul>`).join('')}
      ${!(g.items||[]).length?'<div class="lbl">(기재 없음)</div>':''}</div>`}).join('')||'<div class="empty">내용이 없습니다</div>'}
function htmlInc(){return list('incoming').map(r=>`<tr>${['date','title','author','progress','rev'].map(f=>`<td${f==='title'?' class="t"':''}><span${E()} data-m="inc" data-id="${esc(r.id)}" data-f="${f}">${esc(r[f])}</span></td>`).join('')}<td class="act"><button class="chip" data-incdel="${esc(r.id)}">삭제</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">입고 예정이 없습니다</td></tr>'}
function htmlHold(){return list('hold').map(g=>`<div class="card"><h3>${esc(g.title)}<small>${(g.items||[]).length}건</small></h3>${(g.items||[]).map((i,ji)=>`<div class="item"><span${E()} class="age" data-m="hold" data-g="${esc(g.id)}" data-j="${ji}" data-f="date">${esc(i.date)}</span> <span${E()} data-m="hold" data-g="${esc(g.id)}" data-j="${ji}" data-f="text">${esc(i.text)}</span></div>`).join('')}</div>`).join('')||'<div class="empty">내용이 없습니다</div>'}
function renderMisc(){$('#memo').innerHTML=htmlMemo();$('#inc').innerHTML=htmlInc();$('#hold').innerHTML=htmlHold()}
document.addEventListener('input',e=>{const el=e.target.closest('[data-m]');if(!el)return;const v=el.textContent.trim();const k=el.dataset.m;
  if(k==='memo'){const g=M.memo.get(el.dataset.g);if(!g)return;g.items[+el.dataset.j].text=v;mark('memo',g,['items'])}
  else if(k==='inc'){const r=M.incoming.get(el.dataset.id);if(!r)return;r[el.dataset.f]=v;mark('incoming',r,[el.dataset.f])}
  else if(k==='hold'){const g=M.hold.get(el.dataset.g);if(!g)return;g.items[+el.dataset.j][el.dataset.f]=v;mark('hold',g,['items'])}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-m]')){e.preventDefault();e.target.blur()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-incdel]');if(!b)return;
  if(b.dataset.arm){removeDoc('incoming',b.dataset.incdel);return}
  b.dataset.arm='1';b.textContent='정말 삭제';b.classList.add('on');
  setTimeout(()=>{if(b.isConnected){delete b.dataset.arm;b.textContent='삭제';b.classList.remove('on')}},3000)});
$('#bIncAdd').onclick=async()=>{const mx=Math.max(0,...list('incoming').map(r=>r.order||0));
  await createDoc('incoming',{date:'',title:'새 도서',author:'',progress:'',rev:'',order:mx+1});renderMisc();renderKpis()};

/* ---------- 제목 ---------- */
const todayTitle=()=>{const d=new Date();return '주간계획서 ('+d.getFullYear()+'년 '+String(d.getMonth()+1).padStart(2,'0')+'월 '+String(d.getDate()).padStart(2,'0')+'일)'};
function drawTitle(){const t=todayTitle();$('#ttl').textContent=t;$('#pTtl').textContent=t;document.title=t}

/* ---------- 편집 모드 / 저장 파일 ---------- */
function setEdit(on){st.edit=on&&canWrite;document.body.classList.toggle('edit',st.edit);
  $('#bEdit').classList.toggle('on',st.edit);$('#bEdit').textContent=st.edit?'편집 모드 끄기':'편집 모드';
  $('#incBar').hidden=!st.edit;$('#editBanner').classList.toggle('show',st.edit);
  requestRender(true)}
$('#bEdit').onclick=()=>setEdit(!st.edit);
function dlFail(e){if(e&&e.code==='declined')return;toast('파일을 저장하지 못했습니다.')}
$('#bCsv').onclick=async()=>{if(!dlCap){toast('이 화면에서는 파일 저장을 쓸 수 없습니다');return}
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const rows=[['구분','도서명','차수','저자','작업자','단계','최종갱신','진행내용']];
  filtered().forEach(r=>{const v=V(r);rows.push([r.sec,r.title,revT(r.rev),r.author,(r.workers||[]).join(' / '),v.stage,v.date,v.note])});
  try{await dlCap.save({filename:'주간계획서_'+iso(new Date()).replace(/-/g,'')+'.csv',data:'﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n')})}catch(e){dlFail(e)}};
$('#bPrint').onclick=async()=>{
  if(!dlCap){toast('이 화면에서는 파일 저장을 쓸 수 없습니다');return}
  const was=st.edit;st.edit=false;
  let body='';const title=todayTitle();
  if(curTab==='list'){const a=filtered();body=`<div class="tbl-wrap"><table><thead><tr><th>구분</th><th>도서명</th><th>차수</th><th>저자</th><th>작업자</th><th>단계</th><th>최종 갱신</th><th>진행 내용</th></tr></thead><tbody>${a.map(r=>rowHtml(r,true).replace(/<td class="act">.*?<\/td>/,'')).join('')}</tbody></table></div>`;
    $('#pMeta').textContent=$('#pMeta').textContent}
  else if(curTab==='worker')body=htmlWorkers(true);
  else if(curTab==='memo')body=`<div class="memo-grid">${htmlMemo()}</div>`;
  else if(curTab==='incoming')body=`<div class="tbl-wrap"><table><thead><tr><th>입고(예정)일</th><th>도서명</th><th>저자</th><th>현재 진행</th><th>차수</th></tr></thead><tbody>${htmlInc().replace(/<td class="act">.*?<\/td>/g,'')}</tbody></table></div>`;
  else body=`<div class="memo-grid">${htmlHold()}</div>`;
  st.edit=was;
  const css=$('#pagecss').textContent.replace('.panel{display:none}.panel.on{display:block}','');
  const doc=`<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(title)}</title><style>${css}
body{padding:12px 16px}.printhead{display:block}.wrap{padding:0}.tbl-wrap{max-height:none}th{position:static}
@media print{body{padding:0}}</style></head><body><div class="wrap"><div class="printhead"><h1>${esc(title)}</h1><div class="meta">${esc($('#pMeta').textContent)}</div></div>${body}</div>
<script>addEventListener('load',function(){setTimeout(function(){print()},400)})<\/script></body></html>`;
  try{await dlCap.save({filename:'주간계획서_인쇄용_'+iso(new Date()).replace(/-/g,'')+'.html',data:doc})}catch(e){dlFail(e)}};

/* ---------- 시작 ---------- */
drawTabs();render();renderMisc();drawTitle();
const h0=(location.hash||'#list').slice(1).replace(/[^a-z]/g,'');showTab(TABS.some(t=>t[0]===h0)?h0:'list');

(async()=>{
  const cl=window.claude;
  if(!cl||!cl.use){setConn('err','claude.ai에서 열어야 실시간 기능을 쓸 수 있습니다');return}
  try{db=await cl.use('db')}catch(e){db=null}
  try{userCap=await cl.use('user')}catch(e){userCap=null}
  try{dlCap=await cl.use('downloads')}catch(e){dlCap=null}
  if(!db){setConn('err','로그인 후 사용할 수 있습니다 (데이터를 불러올 수 없음)');loaded.books=true;render();return}
  if(userCap){try{myId=await userCap.id()}catch(e){}
    let cw=null;try{cw=await userCap.can('data.write')}catch(e){}
    canWrite=cw!==false}
  else canWrite=false;
  $('#bEdit').hidden=!canWrite;$('#bAdd').hidden=!canWrite;$('#bAddTop').hidden=!canWrite;$('#roBanner').classList.toggle('show',!canWrite);
  subscribe();
})();
</script>

<script>
(function(){var b=document.getElementById('bPrint');b.textContent='인쇄';b.onclick=function(){if(st.edit)setEdit(false);render();window.print()}})();
</script>
