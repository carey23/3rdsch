<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>주간계획서 뷰어</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2330;--sub:#5d6778;--line:#e1e5ec;--accent:#2457c5;--accent-bg:#e8effc;
--c-prog:#2457c5;--c-wait:#b7791f;--c-stock:#7a5fb0;--c-done:#2f855a;--c-step:#0f8a8a;--c-hold:#c0392b;--c-print:#8a93a3;--warn:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1a1f28;--ink:#e6e9ef;--sub:#99a3b3;--line:#2b323f;--accent:#7ea4f2;--accent-bg:#1f2b45;
--c-prog:#7ea4f2;--c-wait:#e0b050;--c-stock:#b79df0;--c-done:#6fcf97;--c-step:#58c6c6;--c-hold:#f08a7e;--c-print:#7d8696;--warn:#f08a7e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
header{padding:16px 20px 8px}
h1{margin:0;font-size:20px}
.meta{color:var(--sub);font-size:12px;margin-top:2px}
.wrap{padding:0 20px 40px;max-width:1500px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.kpi:hover{border-color:var(--accent)}
.kpi b{display:block;font-size:22px;line-height:1.2}
.kpi span{font-size:12px;color:var(--sub)}
.kpi.on{outline:2px solid var(--accent)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0 12px;flex-wrap:wrap}
.tab{padding:8px 14px;border:0;background:none;color:var(--sub);font:inherit;cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:var(--accent);border-color:var(--accent);font-weight:700}
.panel{display:none}.panel.on{display:block}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.bar input[type=search],.bar select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.bar input[type=search]{min-width:220px;flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:3px 10px;border-radius:999px;font:inherit;font-size:12px;cursor:pointer}
.chip.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:700}
.lbl{font-size:12px;color:var(--sub)}
.count{margin:6px 2px;color:var(--sub);font-size:12px}
.tbl-wrap{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;max-height:72vh}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 9px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:var(--card);font-size:12px;color:var(--sub);cursor:pointer;white-space:nowrap;z-index:1;border-bottom:2px solid var(--line)}
tr.r td:first-child{border-left:4px solid var(--c)}
tr.r:hover td{background:var(--accent-bg)}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;color:#fff;background:var(--c);white-space:nowrap}
.sec{font-size:11px;color:var(--sub)}
.t{font-weight:600}
td.nw{white-space:nowrap}
.age{font-size:11px;color:var(--sub);white-space:nowrap}
.age.old{color:var(--warn);font-weight:700}
.w{cursor:pointer;color:var(--accent)}
.w:hover{text-decoration:underline}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.card h3{margin:0 0 6px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.card h3 small{color:var(--sub);font-weight:400}
.mini{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.item{padding:5px 0;border-top:1px dashed var(--line);font-size:13px}
.item .n{color:var(--sub);font-size:12px}
.memo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.card ul{margin:4px 0 0;padding-left:18px}
.card li{margin:2px 0}
.empty{color:var(--sub);padding:20px;text-align:center}
.note{font-size:12px;color:var(--sub);margin-top:14px;line-height:1.6}
@media print{.bar,.tabs,.kpis{display:none}.panel{display:block!important}.tbl-wrap{max-height:none}}
</style>
</head>
<body>
<header>
  <h1 id="ttl">주간계획서</h1>
  <div class="meta" id="meta"></div>
</header>
<div class="wrap">
  <div class="kpis" id="kpis"></div>
  <div class="tabs" id="tabs"></div>

  <section class="panel" id="p-list">
    <div class="bar">
      <input type="search" id="q" placeholder="도서명·저자·작업자·진행내용 검색">
      <select id="fSec"></select>
      <select id="fKind"><option value="">신간+개정</option><option>신간</option><option>개정</option></select>
      <select id="fWorker"></select>
      <label class="lbl">정체 기준 <select id="thr"><option value="7">7일</option><option value="14" selected>14일</option><option value="30">30일</option></select></label>
      <label class="lbl"><input type="checkbox" id="hidePrint" checked> 인쇄완료 숨기기</label>
      <label class="lbl"><input type="checkbox" id="onlyStale"> 정체만</label>
      <button class="chip" id="reset">초기화</button>
    </div>
    <div class="bar" style="padding:6px 10px"><span class="lbl">단계</span><div class="chips" id="stageChips"></div></div>
    <div class="count" id="count"></div>
    <div class="tbl-wrap"><table>
      <thead><tr>
        <th data-k="sec">구분</th><th data-k="title">도서명</th><th data-k="rev">차수</th><th data-k="author">저자</th>
        <th data-k="workers">작업자</th><th data-k="stage">단계</th><th data-k="date">최종 갱신</th><th>진행 내용</th>
      </tr></thead>
      <tbody id="tb"></tbody>
    </table></div>
  </section>

  <section class="panel" id="p-worker"><div class="cards" id="wcards"></div></section>
  <section class="panel" id="p-memo"><div class="memo-grid" id="memo"></div></section>
  <section class="panel" id="p-incoming"><div class="tbl-wrap"><table>
      <thead><tr><th>입고(예정)일</th><th>도서명</th><th>저자</th><th>현재 진행</th><th>차수</th></tr></thead><tbody id="inc"></tbody></table></div></section>
  <section class="panel" id="p-hold"><div class="memo-grid" id="hold"></div></section>

  <div class="note" id="note"></div>
</div>

const STAGE={'진행중':'--c-prog','대기':'--c-wait','재고대기':'--c-stock','단계완료':'--c-step','보류':'--c-hold','인쇄완료':'--c-print'};
const ORDER=['진행중','대기','단계완료','재고대기','보류','인쇄완료'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const isStale=r=>r.age!=null&&r.age>=st.thr&&['진행중','대기','단계완료'].includes(r.stage);
const col=s=>`var(${STAGE[s]})`;

function mmdd(iso){return iso?iso.slice(2).replace(/-/g,'.'):'-'}
function ageTxt(r){ if(r.age==null)return '<span class="age">상시</span>';
  const cls=isStale(r)?'age old':'age'; return `<span class="${cls}">${mmdd(r.date)} · ${r.age}일 전</span>`}

$('#tabs').innerHTML=TABS.map(([k,n])=>`<button class="tab" data-t="${k}">${n}</button>`).join('');
function showTab(k){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===k));

function filtered(){
  let a=recs.filter(r=>{
    if(st.hidePrint&&r.stage==='인쇄완료'&&!st.stages.has('인쇄완료'))return false;
    if(st.stages.size&&!st.stages.has(r.stage))return false;
    if(st.sec&&r.sec!==st.sec)return false;
    if(st.kind&&r.kind!==st.kind)return false;
    if(st.worker&&!r.workers.includes(st.worker))return false;
    if(st.onlyStale&&!isStale(r))return false;
    if(st.q){const h=(r.title+r.author+r.workers.join(' ')+r.note+r.sec+r.rev+r.extra).toLowerCase();
      if(!st.q.split(/\s+/).every(t=>h.includes(t)))return false}
    return true});
  const {k,dir}=st.sort;
  const v=r=>k==='workers'?r.workers.join(','):k==='date'?(r.date||'9999'):k==='stage'?ORDER.indexOf(r.stage):(r[k]||'');
  a.sort((x,y)=>{const A=v(x),B=v(y);const c=(A<B?-1:A>B?1:0)*dir; if(c)return c; const d1=x.date||'9999',d2=y.date||'9999'; return (d1<d2?-1:d1>d2?1:0)||x.i-y.i});
  return a}

function render(){
  const a=filtered();
  $('#count').textContent=`${a.length}건 표시 (전체 ${recs.length}건) · 정체 기준 ${st.thr}일 · 헤더 클릭 시 정렬`;
  $('#tb').innerHTML=a.length?a.map(r=>`<tr class="r" style="--c:${col(r.stage)}">
    <td><span class="sec">${esc(r.secShort)}</span>${r.extra?`<div class="sec">${esc(r.extra.split('|')[0])}</div>`:''}</td>
    <td class="t">${esc(r.title)}</td><td class="nw">${esc(r.rev)}</td><td class="nw">${esc(r.author)}</td>
    <td>${r.workers.map(w=>`<span class="w" data-w="${esc(w)}">${esc(w)}</span>`).join(' / ')}</td>
    <td><span class="badge" style="--c:${col(r.stage)}">${r.stage}</span></td>
    <td>${ageTxt(r)}</td><td>${esc(r.note)}${r.extra&&r.extra.includes('|')?`<div class="sec">${esc(r.extra.split('|')[1])}</div>`:''}</td></tr>`).join('')
    :'<tr><td colspan="8" class="empty">조건에 맞는 도서가 없습니다</td></tr>';
  document.querySelectorAll('#stageChips .chip').forEach(c=>c.classList.toggle('on',st.stages.has(c.dataset.s)));
  renderKpis();
}

function renderKpis(){
  const act=recs.filter(r=>r.stage!=='인쇄완료');
  const n=s=>recs.filter(r=>r.stage===s).length;
  const stale=recs.filter(isStale).length;
  const K=[['작업 중 도서',act.length,()=>{st.hidePrint=true;st.stages.clear()}],
    ['진행중',n('진행중'),()=>{st.stages=new Set(['진행중'])}],
    ['대기',n('대기')+n('재고대기'),()=>{st.stages=new Set(['대기','재고대기'])}],
    ['정체 의심 ('+st.thr+'일+)',stale,()=>{st.onlyStale=true;st.stages.clear()}],
    ['신간 진행',recs.filter(r=>r.kind==='신간'&&r.stage!=='인쇄완료').length,()=>{st.kind='신간';st.stages.clear()}],
    ['입고 예정',D.incoming.length,()=>showTab('incoming')]];
  $('#kpis').innerHTML=K.map((k,i)=>`<div class="kpi" data-k="${i}"><b>${k[1]}</b><span>${k[0]}</span></div>`).join('');
  document.querySelectorAll('.kpi').forEach(el=>el.onclick=()=>{const f=K[+el.dataset.k][2];
    if(+el.dataset.k!==5){showTab('list');$('#onlyStale').checked=false;st.onlyStale=false;st.kind='';}
    f();$('#onlyStale').checked=st.onlyStale;$('#fKind').value=st.kind;$('#hidePrint').checked=st.hidePrint;render()})
}

/* worker cards */
function renderWorkers(){
  const html=wnames.map(w=>{
    const mine=recs.filter(r=>r.workers.includes(w)&&r.stage!=='인쇄완료').sort((a,b)=>(a.date||'9999')<(b.date||'9999')?-1:1);
    if(!mine.length)return '';
    const cnt={};mine.forEach(r=>cnt[r.stage]=(cnt[r.stage]||0)+1);
    return `<div class="card"><h3><span class="w" data-w="${esc(w)}">${esc(w)}</span><small>작업 중 ${mine.length}건</small></h3>
      <div class="mini">${ORDER.filter(s=>cnt[s]).map(s=>`<span class="badge" style="--c:${col(s)}">${s} ${cnt[s]}</span>`).join('')}</div>
      ${mine.map(r=>`<div class="item"><span class="badge" style="--c:${col(r.stage)}">${r.stage}</span> <b>${esc(r.title)}</b> ${esc(r.rev)}
        <div class="n">${esc(r.note)} · ${ageTxt(r)}</div></div>`).join('')}</div>`}).join('');
  $('#wcards').innerHTML=html||'<div class="empty">없음</div>';
}

      ${!g.items.length?'<div class="lbl">(기재 없음)</div>':''}</div>`}).join('');

  $('#hold').innerHTML=D.hold.map(g=>`<div class="card"><h3>${esc(g.title)}<small>${g.items.length}건</small></h3>${g.items.map(i=>`<div class="item"><span class="age">${esc(i.date)}</span> ${esc(i.text)}</div>`).join('')}</div>`).join('');
