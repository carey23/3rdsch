<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>주간계획서 현황</title>
<style id="pagecss">
/* layout: 상단 요약 카드 → 탭(도서 목록 / 작업자별 / 체크포인트 / 입고예정 / 보류) → 표. 편집 모드에서 칸을 직접 고치고 모든 접속자에게 실시간 반영 */
:root{--on-accent:#fff;--bg:#f6f7f9;--card:#fff;--ink:#1c2330;--sub:#5d6778;--line:#e1e5ec;--accent:#2457c5;--accent-bg:#e8effc;
--c-prog:#2457c5;--c-wait:#b7791f;--c-stock:#7a5fb0;--c-done:#2f855a;--c-step:#0f8a8a;--c-hold:#c0392b;--c-print:#8a93a3;--warn:#c0392b;--ok:#2f855a;--g1:#2e7d32;--g2:#5f7312;--g3:#c2410c;--g4:#be185d;--gx:#5b6472}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--on-accent:#0b1220;--bg:#12151b;--card:#1a1f28;--ink:#e6e9ef;--sub:#99a3b3;--line:#2b323f;--accent:#7ea4f2;--accent-bg:#1f2b45;
--c-prog:#7ea4f2;--c-wait:#e0b050;--c-stock:#b79df0;--c-done:#6fcf97;--c-step:#58c6c6;--c-hold:#f08a7e;--c-print:#7d8696;--warn:#f08a7e;--ok:#6fcf97;--g1:#7fd08a;--g2:#c3d86a;--g3:#fb923c;--g4:#f472b6;--gx:#a3acba;color-scheme:dark}}
:root[data-theme="dark"]{--on-accent:#0b1220;--bg:#12151b;--card:#1a1f28;--ink:#e6e9ef;--sub:#99a3b3;--line:#2b323f;--accent:#7ea4f2;--accent-bg:#1f2b45;
--c-prog:#7ea4f2;--c-wait:#e0b050;--c-stock:#b79df0;--c-done:#6fcf97;--c-step:#58c6c6;--c-hold:#f08a7e;--c-print:#7d8696;--warn:#f08a7e;--ok:#6fcf97;--g1:#7fd08a;--g2:#c3d86a;--g3:#fb923c;--g4:#f472b6;--gx:#a3acba;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
header{padding:16px 0 8px;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between}
[hidden]{display:none!important}
h1{margin:0;font-size:20px}
.home{display:inline-flex;align-items:center;gap:10px;font:inherit;color:var(--ink);background:none;border:0;padding:4px 10px 4px 4px;margin-left:-4px;border-radius:10px;cursor:pointer}
.home .hico{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;background:var(--accent);color:#fff;flex:none}
.home .hlbl{font-size:12px;font-weight:600;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:99px;padding:1px 9px}
.home:hover{background:var(--accent-bg)}
.home:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.meta{color:var(--sub);font-size:12px;margin-top:2px}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:700}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-size:12px;color:var(--sub);display:flex;gap:10px;align-items:center}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c-print);margin-right:4px}
.dot.live{background:var(--ok)}.dot.err{background:var(--warn)}
.saved.err{color:var(--warn)}
.wrap{padding:0 0 40px;max-width:1500px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.kpi:hover{border-color:var(--accent)}
.sin{color:#d62828;font-weight:700}
tr.r.locked td{background:color-mix(in srgb,var(--sub) 6%,transparent)}
.hist-link{cursor:pointer;text-decoration:underline dotted}
.hist-link:hover{color:var(--accent)}
#secBack{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:4vh 12px}
#secBack.on{display:flex}
#secBox{background:var(--card);border:1px solid var(--line);border-radius:12px;width:min(720px,100%);max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
#secBox .hh{display:flex;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
#secBox .hh h2{margin:0;font-size:16px;margin-right:auto}
#secBox .hb{overflow:auto;padding:10px 14px 14px;font-size:13px}
#secBox .tip{color:var(--sub);font-size:12px;line-height:1.5;margin:0 0 10px}
#secBox table{width:100%;border-collapse:collapse}
#secBox td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
#secBox input[type=text]{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
#secBox .cnt{color:var(--sub);white-space:nowrap}
#secBox .addrow{display:flex;gap:8px;margin-top:12px}
#histBack{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:4vh 12px}
#histBack.on{display:flex}
#hist{background:var(--card);border:1px solid var(--line);border-radius:12px;width:min(980px,100%);max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
#hist .hh{display:flex;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#hist .hh h2{margin:0;font-size:16px;margin-right:auto}
#hist .hh input{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);min-width:200px}
#hist .hb{overflow:auto;padding:4px 14px 12px}
#hist table{width:100%;border-collapse:collapse;font-size:13px}
#hist th{position:sticky;top:0;background:var(--card);text-align:left;font-size:11px;color:var(--sub);padding:8px 6px;border-bottom:1px solid var(--line)}
#hist td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
#hist .vo{color:var(--sub);text-decoration:line-through}
#hist .vn{font-weight:600}
#hist .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--accent-bg);color:var(--accent)}
#hist .tag.del{background:color-mix(in srgb,var(--warn) 15%,var(--card));color:var(--warn)}
#hist .msg{padding:24px 6px;color:var(--sub);font-size:13px}
table.list{table-layout:fixed}
@media screen{table.list{min-width:1260px}}
table.list td{word-break:keep-all;overflow-wrap:anywhere}
table.list th{overflow:hidden;text-overflow:ellipsis}
col.act{display:none}
body.edit col.act{display:table-column}
td.nm{line-height:1.5}
td.nm .w{white-space:nowrap}
td.nm [contenteditable]{min-width:5em;display:block}
td.prog{padding:0}
.pw{display:grid;grid-template-columns:10fr 12fr 19fr;align-items:start}
.pw+.pw{border-top:1px dashed var(--line)}
.pc{padding:7px 9px;min-width:0}
.pc .age-box{margin-top:3px}
.pwn{font-size:11px;color:var(--sub);font-weight:600;margin-bottom:3px}
.pfoot{padding:0 9px 6px;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.grip{cursor:grab;color:var(--sub);user-select:none;margin-right:6px;font-size:13px;letter-spacing:-2px}
.grip:active{cursor:grabbing}
tr.r.dragging{opacity:.4}
tr.r.dropb td{box-shadow:inset 0 3px 0 var(--accent)}
tr.r.dropa td{box-shadow:inset 0 -3px 0 var(--accent)}
.ed-sin{color:#d62828;font-weight:700}
.recent{background:color-mix(in srgb,var(--accent) 9%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-left:4px solid var(--accent);border-radius:10px;padding:8px 12px;margin:0 0 12px;display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.recent>b{font-size:12px;color:var(--accent);align-self:center;white-space:nowrap}
.recent .ri{flex:1 1 220px;min-width:0;border:1px solid color-mix(in srgb,var(--accent) 25%,var(--line));border-radius:8px;padding:6px 10px;cursor:pointer;background:color-mix(in srgb,var(--accent) 4%,var(--card));text-align:left;font:inherit;color:var(--ink)}
.recent .ri:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card))}
.recent .ri strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent .ri span{font-size:11px;color:var(--sub)}
.recent .none{font-size:12px;color:var(--sub);align-self:center}
.kpi b{display:block;font-size:22px;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--sub)}
.tabs{display:flex;gap:6px;margin:16px 0 14px;flex-wrap:wrap;padding:6px;background:color-mix(in srgb,var(--accent) 8%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 22%,var(--line));border-radius:14px}
.tab{flex:1 1 auto;min-width:120px;padding:11px 18px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--ink);font:inherit;font-size:15px;font-weight:600;text-align:center;cursor:pointer;transition:background .15s,box-shadow .15s}
.tab:hover{background:color-mix(in srgb,var(--accent) 14%,var(--card))}
.tab.on{background:var(--accent);color:var(--on-accent);font-weight:700;box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 45%,transparent)}
.tab.on:hover{background:var(--accent)}
.panel{display:none}.panel.on{display:block}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.bar input[type=search],.bar select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);max-width:100%}
.bar input[type=search]{min-width:200px;flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:3px 10px;border-radius:999px;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:700}
.lbl{font-size:12px;color:var(--sub)}
.count{margin:6px 2px;color:var(--sub);font-size:12px}
.banner{display:none;margin:0 0 10px;padding:8px 12px;border:1px solid var(--accent);background:var(--accent-bg);color:var(--accent);border-radius:8px;font-size:13px}
.banner.show{display:block}
.banner.warn{border-color:var(--warn);color:var(--warn);background:var(--card)}
.tbl-wrap{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;max-height:72vh}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 9px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:var(--card);font-size:12px;color:var(--sub);cursor:pointer;white-space:nowrap;z-index:1;border-bottom:2px solid var(--line)}
th.act,td.act{display:none;cursor:default;white-space:nowrap}
body.edit th.act,body.edit td.act{display:table-cell}
tr.r td:first-child{border-left:4px solid var(--c)}
tr.r:hover td{background:var(--accent-bg)}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;color:#fff;background:var(--c);white-space:nowrap}
.sec{font-size:11px;color:var(--sub)}
.t{font-weight:600}
td.nw{white-space:nowrap}
.age{font-size:11px;color:var(--sub);white-space:nowrap}
.age.old{color:var(--warn);font-weight:700}
.w{cursor:pointer;color:var(--ink)}
.w:hover{text-decoration:underline}
.card h3 .w{font-weight:700}
body.edit [contenteditable]{outline:1px dashed var(--line);border-radius:3px;padding:1px 4px;min-width:3ch;display:inline-block;max-width:100%}
body.edit [contenteditable]:focus{outline:2px solid var(--accent);background:var(--accent-bg)}
body.edit [contenteditable]:empty::before{content:'입력';color:var(--sub)}
td select,td input[type=date]{font:inherit;font-size:12px;padding:2px 4px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);max-width:100%}
.cards{align-items:start;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.card h3{margin:0 0 6px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.card h3 small{color:var(--sub);font-weight:400}
.mini{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.item{padding:5px 0;border-top:1px dashed var(--line);font-size:13px}
.item .n{color:var(--sub);font-size:12px}
.memo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:12px}
.card ul{margin:4px 0 0;padding-left:18px}
.card li{margin:2px 0}
.empty{color:var(--sub);padding:24px;text-align:center}
.note{font-size:12px;color:var(--sub);margin-top:14px;line-height:1.6}
.printhead{display:none}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw}
#toast.show{opacity:1}

.wgroup{margin-bottom:22px}
.g1{--g:var(--g1)}.g2{--g:var(--g2)}.g3{--g:var(--g3)}.g4{--g:var(--g4)}.gx{--g:var(--gx)}
.wgroup h2{font-size:16px;margin:20px 0 12px;padding:8px 12px;border-left:6px solid var(--g);background:color-mix(in srgb,var(--g) 13%,var(--card));border-radius:6px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.wgroup .card{border-top:3px solid var(--g)}
.wgroup .card.idle{border-top:3px dashed var(--g)}
.wgroup h2 small{color:var(--sub);font-weight:400;font-size:12px}
.card h3 .hr{display:flex;gap:8px;align-items:center}
.stbtn{font:inherit;font-size:11px;font-weight:700;cursor:pointer;color:var(--c);background:transparent;border:0;box-shadow:inset 0 0 0 1.5px var(--c);padding:1px 9px;border-radius:999px;display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.stbtn::before{content:'▸';font-size:10px}
.stbtn[aria-expanded="true"]{background:var(--c);color:#fff}
.stbtn[aria-expanded="true"]::before{content:'▾'}
.stbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wstage{display:none;margin-top:2px}.wstage.open{display:block}
.wstage .shead{font-size:11px;color:var(--sub);margin:6px 0 0}
.card.idle{background:transparent;border-style:dashed}
.card.idle .lbl{padding:2px 0}
@page{size:A4 landscape;margin:10mm}
@media print{
  :root:root:root{--bg:#fff;--card:#fff;--ink:#000;--sub:#444;--line:#bbb;--accent:#1b3f94;--accent-bg:#fff;--c-prog:#2457c5;--c-wait:#b7791f;--c-stock:#7a5fb0;--c-done:#2f855a;--c-step:#0f8a8a;--c-hold:#c0392b;--c-print:#8a93a3;--warn:#c0392b;--g1:#2e7d32;--g2:#5f7312;--g3:#c2410c;--g4:#be185d;--gx:#5b6472}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{font-size:10px;background:#fff;padding:0}
  header,.kpis,.tabs,.bar,.banner,.note,.no-print,.act,#toast,#histBack,#secBack{display:none!important}
  .wrap{padding:0;max-width:none}
  .panel{display:none!important}.panel.on{display:block!important}
  .printhead{display:block;margin-bottom:6px}
  .printhead h1{font-size:15px}
  .tbl-wrap{max-height:none;overflow:visible;border:0}
  th{position:static;cursor:default}
  tr{break-inside:avoid}
  th,td{padding:3px 5px}
  tr.r:hover td{background:none}
  .cards,.memo-grid{display:block;column-count:2;column-gap:10px}
  .card{break-inside:avoid;margin-bottom:8px}
  .w{color:inherit}
  .wstage{display:block!important}
  .stbtn{box-shadow:none;background:var(--c);color:#fff}
  .stbtn::before{content:''}
  .wgroup{break-inside:auto}
}
/* ===== 오늘의 업무일지 ===== */
.jrbtn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:14px;font-weight:700;color:#fff;border:0;cursor:pointer;padding:8px 16px 8px 13px;border-radius:99px;
 background:linear-gradient(135deg,#27389a 0%,#2f6fd0 55%,#17a2a2 100%);box-shadow:0 3px 12px rgba(39,56,154,.35);transition:transform .15s,box-shadow .15s}
.jrbtn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(39,56,154,.45)}
.jrbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.jrbtn b{min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:rgba(255,255,255,.22);font-size:12px;line-height:22px;text-align:center}
body.jr-open>header,body.jr-open>.wrap{display:none!important}
#jr{max-width:1180px;margin:0 auto;padding:14px 0 40px;page:jr}
@page jr{size:A4 portrait;margin:12mm}
.jr-hero{position:relative;overflow:hidden;border-radius:22px;color:#fff;padding:20px 26px 22px;
 background:radial-gradient(900px 300px at 100% -20%,rgba(23,162,162,.55),transparent 60%),radial-gradient(700px 300px at -10% 120%,rgba(120,90,220,.45),transparent 60%),linear-gradient(135deg,#17205a,#243d95 60%,#1c6f9e)}
.jr-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.jr-hbtn{font:inherit;font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:6px 14px;cursor:pointer}
.jr-hbtn:hover{background:rgba(255,255,255,.26)}
.jr-hbtn.solid{background:#fff;color:#1c2f86;border-color:#fff}
.jr-hbtn.solid:hover{background:#eef2ff}
.jr-hbtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.jr-date{margin:16px 0 4px}
.jr-date small{display:block;font-size:13px;letter-spacing:.14em;opacity:.8;font-weight:600}
.jr-date h2{margin:2px 0 0;font-size:34px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
.jr-date h2 span{font-weight:500;opacity:.8;font-size:22px;margin-left:8px}
.jr-nav{display:flex;gap:6px;align-items:center;margin-top:12px;flex-wrap:wrap}
.jr-nav input[type=date]{font:inherit;font-size:13px;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:5px 12px;color-scheme:dark}
.jr-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:18px}
.jr-k{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:10px 14px;backdrop-filter:blur(2px)}
.jr-k b{display:block;font-size:26px;line-height:1.1;font-weight:800}
.jr-k span{font-size:12px;opacity:.85}
.jr-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 2px 12px}
.jr-bar select{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.jr-bar .lbl{color:var(--sub);font-size:12px}
.jr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.jr-c{--gc:var(--gx);background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 1px 2px rgba(20,30,60,.05)}
.jr-c.me{border-color:color-mix(in srgb,var(--gc) 55%,var(--line));box-shadow:0 0 0 3px color-mix(in srgb,var(--gc) 14%,transparent)}
.jr-ch{display:flex;align-items:center;gap:12px;padding:14px 16px;background:linear-gradient(90deg,color-mix(in srgb,var(--gc) 14%,var(--card)),var(--card))}
.jr-av{flex:none;width:40px;height:40px;border-radius:13px;background:var(--gc);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.jr-nm{font-size:16px;font-weight:800;line-height:1.2}
.jr-nm small{display:block;font-size:11px;font-weight:600;color:var(--gc);margin-top:2px}
.jr-cnt{margin-left:auto;font-size:12px;font-weight:700;color:var(--gc);background:color-mix(in srgb,var(--gc) 13%,var(--card));border-radius:99px;padding:3px 11px;white-space:nowrap}
.jr-cnt.z{color:var(--sub);background:var(--bg)}
.jr-b{padding:4px 16px 14px}
.jr-it{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:10px 0;border-top:1px dashed var(--line)}
.jr-it:first-child{border-top:0}
.jr-st{--c:var(--c-prog);align-self:start;font-size:11px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 15%,var(--card));border:1px solid color-mix(in srgb,var(--c) 40%,transparent);border-radius:99px;padding:1px 9px;white-space:nowrap;margin-top:2px}

.jr-nt{grid-column:2;color:var(--ink);font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:keep-all}
.jr-co{grid-column:2;font-size:11px;color:var(--sub)}
.jr-none{color:var(--sub);font-size:13px;padding:8px 0}
.jr-on{margin-top:4px;border-top:1px dashed var(--line);padding-top:8px}
.jr-on summary{cursor:pointer;color:var(--sub);font-size:12px;font-weight:600}
.jr-on div.o{display:flex;gap:8px;align-items:baseline;padding:4px 0;font-size:12.5px}
.jr-on .o i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c,var(--c-prog));transform:translateY(0)}
.jr-on .o span{color:var(--sub);margin-left:auto;white-space:nowrap;font-size:11px}
.jr-opw{border-top:1px solid var(--line);background:color-mix(in srgb,var(--gc) 5%,var(--card));padding:10px 16px 12px}
.jr-opw label{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--gc);margin-bottom:6px}
.jr-opw label .jr-sv{font-weight:500;color:var(--sub)}
.jr-op{width:100%;min-height:64px;resize:none;overflow:hidden;font:inherit;font-size:13px;line-height:1.55;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.jr-op:focus{outline:2px solid color-mix(in srgb,var(--gc) 60%,transparent);outline-offset:0;border-color:transparent}
.jr-ro{font-size:13px;white-space:pre-wrap;line-height:1.55}
.op-p{display:none}
.jr-foot{margin:16px 4px 0;color:var(--sub);font-size:12px}
.jr-empty{grid-column:1/-1;text-align:center;color:var(--sub);padding:50px 10px;background:var(--card);border:1px dashed var(--line);border-radius:18px}
@media(max-width:760px){.jr-grid{grid-template-columns:1fr}.jr-kpis{grid-template-columns:repeat(2,1fr)}.jr-date h2{font-size:26px}.jr-hero{padding:16px}}
@media print{
 body.jr-open{background:#fff!important;color:#111;padding:0}

 .jr-ch{background:#f1f3f7!important;padding:7px 10px;-webkit-print-color-adjust:exact;print-color-adjust:exact}

 .jr-st{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .jr-on,.no-print,.jr-op,.jr-opw label .jr-sv{display:none!important}
 .jr-opw{background:#fafafa!important;padding:6px 10px}
 .op-p{display:block;white-space:pre-wrap;font-size:12px;line-height:1.5}
 .jr-opw.empty{display:none}
 .jr-foot{color:#444;font-size:10px}
 .jr-tt{font-size:12.5px}.jr-tt em{font-size:10.5px}.jr-nt{font-size:11.5px;line-height:1.45}.jr-co{font-size:10px}.jr-st{font-size:10px}
 .jr-nm{font-size:14px}.jr-nm small{font-size:10px}.jr-cnt{font-size:10.5px}
 .jr-c.idle{display:none!important}
}

<script>
/* Supabase 연동 계층: 화면 코드가 쓰는 db/user/downloads 인터페이스를 Supabase RPC + 주기적 갱신으로 구현 */
(function(){
const URL_='https://vqnsffkqljnhcxtwqkxx.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxbnNmZmtxbGpuaGN4dHdxa3h4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NzA2NDIsImV4cCI6MjEwOTE0NjY0Mn0.hZYPvkiD96WZbeoQ-1GNiXtfxTJn0FVdrsaGSo4j78A';
const POLL=window.JP_POLL_MS||4000;
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
let PW=ls.get('jp-pw')||'',NAME=ls.get('jp-name')||'',ME=null;
const cred=()=>({p_name:NAME,p_pw:PW});
const NOFN=x=>/Could not find the function/i.test(x&&x.message||'');

async function rpc(fn,args){
  let r;
  try{r=await fetch(URL_+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(args)})}
  catch(e){throw {code:'network',message:String(e)}}
  const t=await r.text();let j=null;try{j=JSON.parse(t)}catch(e){}
  if(!r.ok){const m=(j&&(j.message||j.error))||t;
    throw {code:/bad_password/.test(m)?'bad_password':/forbidden/.test(m)?'forbidden':'error',message:m}}
  return j}

/* ---------- 화면 조각 (로그인·비밀번호·계정 관리) ---------- */
const css=document.createElement('style');
css.textContent=`.jpOv{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.jpOv.dim{background:rgba(0,0,0,.45);z-index:90;align-items:flex-start;padding-top:4vh}
.jpOv form,.jpOv .jpBox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;width:min(360px,100%);display:flex;flex-direction:column;gap:10px;color:var(--ink)}
.jpOv .jpBox.wide{width:min(720px,100%);max-height:92vh;overflow:auto}
.jpOv h2{margin:0 0 4px;font-size:18px}.jpOv p{margin:0;color:var(--sub);font-size:12px;line-height:1.5}
.jpOv input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.jpOv .err{color:var(--warn);font-size:12px;min-height:1.2em}
.jpOv table{width:100%;border-collapse:collapse;font-size:13px}.jpOv th{text-align:left;font-size:11px;color:var(--sub);padding:6px;border-bottom:1px solid var(--line)}
.jpOv td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
.jpOv .jpTmp{background:var(--accent-bg);border:1px solid var(--accent);border-radius:8px;padding:10px;font-size:13px}
.jpOv .jpTmp b{font-size:16px;letter-spacing:1px;user-select:all}
#jpWho{font-size:12px;color:var(--sub);align-self:center;white-space:nowrap}`;
document.head.appendChild(css);
const ESC=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const randPw=()=>{const cs='abcdefghjkmnpqrstuvwxyz23456789',a=new Uint32Array(8);crypto.getRandomValues(a);return [...a].map(x=>cs[x%cs.length]).join('')};
const loginErr=x=>x.code==='bad_password'?'이름 또는 비밀번호가 맞지 않습니다.':NOFN(x)?'서버 설정이 아직 끝나지 않았습니다. (개인 계정 SQL을 실행해야 합니다)':'서버에 연결하지 못했습니다. 잠시 뒤 다시 시도하세요.';

function askLogin(msg){return new Promise(res=>{
  const d=document.createElement('div');d.id='jpLogin';d.className='jpOv';
  d.innerHTML=`<form><h2>주간계획서 현황</h2><p>이름(아이디)과 개인 비밀번호를 입력하세요. 처음이면 전달받은 초기 비밀번호를 입력하고, 이어서 새 비밀번호를 정하게 됩니다.</p>
  <input id="jpName" placeholder="이름 (예: 김지혜)" autocomplete="username" value="${ESC(NAME)}">
  <input id="jpPw" type="password" placeholder="비밀번호" autocomplete="current-password">
  <div class="err" id="jpErr">${msg||''}</div><button class="btn primary" type="submit">들어가기</button></form>`;
  document.body.appendChild(d);
  d.querySelector('form').onsubmit=async e=>{e.preventDefault();const n=d.querySelector('#jpName').value.trim(),p=d.querySelector('#jpPw').value;
    if(!n||!p){d.querySelector('#jpErr').textContent='이름과 비밀번호를 모두 입력하세요.';return}
    d.querySelector('#jpErr').textContent='확인 중…';
    try{ME=await rpc('jp_login',{p_name:n,p_pw:p});PW=p;NAME=ME.name;ls.set('jp-pw',p);ls.set('jp-name',NAME);d.remove();res()}
    catch(x){d.querySelector('#jpErr').textContent=loginErr(x)}};
  setTimeout(()=>d.querySelector(NAME?'#jpPw':'#jpName').focus(),50)})}

function forceChange(){return new Promise(res=>{
  const d=document.createElement('div');d.id='jpForce';d.className='jpOv';
  d.innerHTML=`<form><h2>새 비밀번호 정하기</h2><p>${ESC(NAME)}님, 처음 로그인했거나 관리자가 비밀번호를 초기화했습니다. 본인만 아는 새 비밀번호(6자 이상)를 정해 주세요.</p>
  <input id="jpN1" type="password" placeholder="새 비밀번호 (6자 이상)" autocomplete="new-password">
  <input id="jpN2" type="password" placeholder="새 비밀번호 한 번 더" autocomplete="new-password">
  <div class="err" id="jpErr2"></div><button class="btn primary" type="submit">변경하고 들어가기</button>
  <button class="btn" type="button" id="jpOut2">로그아웃</button></form>`;
  document.body.appendChild(d);
  d.querySelector('#jpOut2').onclick=()=>{ls.del('jp-pw');location.reload()};
  d.querySelector('form').onsubmit=async e=>{e.preventDefault();const a=d.querySelector('#jpN1').value,b=d.querySelector('#jpN2').value,er=d.querySelector('#jpErr2');
    if(a.length<6){er.textContent='6자 이상으로 정해 주세요.';return}
    if(a!==b){er.textContent='두 번 입력한 비밀번호가 다릅니다.';return}
    if(a===PW){er.textContent='현재 비밀번호와 다른 것으로 정해 주세요.';return}
    er.textContent='변경 중…';
    try{await rpc('jp_set_password',{...cred(),p_new:a});PW=a;ls.set('jp-pw',a);ME.must_change=false;d.remove();res()}
    catch(x){er.textContent='변경하지 못했습니다. 잠시 뒤 다시 시도하세요.'}};
  setTimeout(()=>d.querySelector('#jpN1').focus(),50)})}

async function ensureLogin(){
  if(PW&&NAME){
    try{ME=await rpc('jp_login',cred())}
    catch(x){if(x.code==='bad_password'){ls.del('jp-pw');PW=''}else{ME=null;return}}}
  if(!PW||!NAME||!ME)await askLogin('');
  if(ME&&ME.must_change)await forceChange()}
async function refreshMe(){if(ME||!PW)return;try{ME=await rpc('jp_login',cred());fillWho();window.dispatchEvent(new Event('jp-me'))}catch(e){}}

/* ---------- 계정 관리 (관리자 전용) ---------- */
async function openAdmin(){
  const d=document.createElement('div');d.className='jpOv dim';
  d.innerHTML=`<div class="jpBox wide"><h2>계정 관리</h2><p>비밀번호를 초기화하면 임시 비밀번호가 한 번만 표시됩니다. 본인에게 전달하세요. 그 사람은 다음 로그인 때 새 비밀번호를 직접 정합니다.</p>
  <div id="jpTmp"></div><div id="jpList"><p>불러오는 중…</p></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><input id="jpNewName" placeholder="새 계정 이름" style="flex:1;min-width:140px"><button class="btn" id="jpAdd">계정 추가</button><button class="btn primary" id="jpClose">닫기</button></div></div>`;
  document.body.appendChild(d);
  const close=()=>d.remove();d.querySelector('#jpClose').onclick=close;d.addEventListener('click',e=>{if(e.target===d)close()});
  const showTmp=(name,pw)=>{d.querySelector('#jpTmp').innerHTML=`<div class="jpTmp"><b>${ESC(name)}</b> 님 임시 비밀번호: <b>${ESC(pw)}</b> <button class="btn" id="jpCopy">복사</button><br><span style="color:var(--sub)">이 창을 닫거나 다른 작업을 하면 다시 볼 수 없습니다. 필요하면 다시 초기화하세요.</span></div>`;
    d.querySelector('#jpCopy').onclick=async()=>{try{await navigator.clipboard.writeText(pw);d.querySelector('#jpCopy').textContent='복사됨'}catch(e){d.querySelector('#jpCopy').textContent='직접 복사해 주세요'}}};
  async function load(){
    try{const u=await rpc('jp_admin_users',cred());
      d.querySelector('#jpList').innerHTML=`<table><thead><tr><th>이름</th><th>권한</th><th>상태</th><th></th></tr></thead><tbody>${u.map(x=>`<tr><td>${ESC(x.name)}</td><td>${x.is_admin?'관리자 (전체 수정)':'일반 (본인 담당만)'}</td><td>${x.must_change?'<span style="color:var(--warn)">비밀번호 변경 대기</span>':'사용 중'}</td>
        <td style="white-space:nowrap"><button class="btn" data-reset="${ESC(x.name)}">비밀번호 초기화</button> <button class="btn" data-role="${ESC(x.name)}" data-to="${x.is_admin?0:1}">${x.is_admin?'관리자 해제':'관리자 지정'}</button></td></tr>`).join('')}</tbody></table>`}
    catch(x){d.querySelector('#jpList').innerHTML='<p>계정 목록을 불러오지 못했습니다.</p>'}}
  d.addEventListener('click',async e=>{
    const r=e.target.closest('[data-reset]'),ro=e.target.closest('[data-role]');
    if(r){const n=r.dataset.reset;if(!confirm(n+' 님의 비밀번호를 초기화할까요? 지금 쓰던 비밀번호는 즉시 사용할 수 없게 됩니다.'))return;
      const pw=randPw();try{await rpc('jp_admin_set_password',{...cred(),p_target:n,p_new:pw});showTmp(n,pw);load()}catch(x){alert('초기화하지 못했습니다.')}}
    if(ro){const n=ro.dataset.role,to=ro.dataset.to==='1';if(!confirm(n+' 님을 '+(to?'관리자(전체 수정 권한)로 지정':'일반 사용자로 변경')+'할까요?'))return;
      try{await rpc('jp_admin_set_role',{...cred(),p_target:n,p_admin:to});load()}catch(x){alert(/last_admin/.test(x.message||'')?'마지막 관리자는 해제할 수 없습니다.':'변경하지 못했습니다.')}}});
  d.querySelector('#jpAdd').onclick=async()=>{const n=d.querySelector('#jpNewName').value.trim();if(!n)return;
    const pw=randPw();try{await rpc('jp_admin_set_password',{...cred(),p_target:n,p_new:pw});d.querySelector('#jpNewName').value='';showTmp(n,pw);load()}catch(x){alert('계정을 만들지 못했습니다.')}};
  load()}

function fillWho(){const w=document.getElementById('jpWho');if(w)w.textContent=NAME?(NAME+(ME&&ME.is_admin?' · 관리자':'')):''}
function addAccountButtons(){
  const t=document.querySelector('.tools');if(!t||document.getElementById('jpAcct'))return;
  const w=document.createElement('span');w.id='jpAcct';w.style.display='contents';
  w.innerHTML='<span id="jpWho"></span>'+(ME&&ME.is_admin?'<button class="btn" id="jpAdm">계정 관리</button>':'')+'<button class="btn" id="jpPwBtn">비밀번호 변경</button><button class="btn" id="jpOut">로그아웃</button>';
  t.appendChild(w);fillWho();
  document.getElementById('jpOut').onclick=()=>{ls.del('jp-pw');location.reload()};
  const adm=document.getElementById('jpAdm');if(adm)adm.onclick=openAdmin;
  document.getElementById('jpPwBtn').onclick=async()=>{
    const n=prompt('새 비밀번호 (6자 이상). 바꾸면 다음부터 새 비밀번호로 들어와야 합니다.');if(!n)return;
    try{await rpc('jp_set_password',{...cred(),p_new:n});PW=n;ls.set('jp-pw',n);alert('비밀번호를 바꿨습니다.')}
    catch(x){alert('바꾸지 못했습니다: '+(/too_short/.test(x.message||'')?'6자 이상이어야 합니다.':(x.message||'')))}}}

/* ---------- 캐시 + 구독 ---------- */
const C={books:new Map(),incoming:new Map(),memo:new Map(),hold:new Map(),meta:new Map()};
const subs=[];let ready=false,since='1970-01-01T00:00:00Z',maxTs='';
const mkDoc=(id,data)=>({id,exists:!!data,data:()=>data,metadata:{fromCache:false,hasPendingWrites:false}});
function live(c){return [...C[c]].filter(([,v])=>!v.deleted)}
function emit(c){subs.filter(s=>s.c===c).forEach(s=>{
  const cur=new Map(live(c).map(([id,v])=>[id,JSON.stringify(v.data)]));const ch=[];
  for(const [id,j] of cur){if(!s.sent.has(id))ch.push({type:'added',doc:mkDoc(id,JSON.parse(j))});else if(s.sent.get(id)!==j)ch.push({type:'modified',doc:mkDoc(id,JSON.parse(j))})}
  for(const [id] of s.sent)if(!cur.has(id))ch.push({type:'removed',doc:mkDoc(id,{})});
  if(!ch.length&&s.first===false)return;
  s.sent=cur;s.first=false;
  try{s.next({docChanges:()=>ch,metadata:{fromCache:false,hasPendingWrites:false},docs:[],size:cur.size,empty:!cur.size})}catch(e){console.error(e)}})}
function applyRows(rows){const touched=new Set();
  rows.forEach(r=>{C[r.coll]&&(C[r.coll].set(r.id,{data:r.data||{},deleted:!!r.deleted}),touched.add(r.coll));
    if(r.updated_at&&r.updated_at>maxTs)maxTs=r.updated_at});
  if(maxTs){const d=new Date(maxTs);d.setSeconds(d.getSeconds()-3);since=d.toISOString()}
  return touched}
function setConn(ok){const d=document.getElementById('dot'),c=document.getElementById('conn');if(!d||!c)return;
  d.className='dot '+(ok?'live':'err');c.textContent=ok?'실시간 연결됨':'연결 재시도 중…'}
let pollT=null;
async function poll(){
  clearTimeout(pollT);
  try{const rows=await rpc('jp_pull',{...cred(),since});refreshMe();const t=applyRows(rows||[]);setConn(true);
    if(!ready){ready=true;Object.keys(C).forEach(emit)}else t.forEach(emit)}
  catch(e){if(e.code==='bad_password'){ls.del('jp-pw');location.reload();return}setConn(false)}
  pollT=setTimeout(poll,document.hidden?15000:POLL)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ready){clearTimeout(pollT);poll()}});

function colRef(c){return {onSnapshot(next){const s={c,next,sent:new Map(),first:true};subs.push(s);if(ready)setTimeout(()=>emit(c),0);return()=>{const i=subs.indexOf(s);if(i>=0)subs.splice(i,1)}}}}
function docRef(path){const [c,id]=path.split('/');
  const write=async patch=>{await rpc('jp_patch',{...cred(),p_coll:c,p_id:id,p_patch:patch});
    const cur=C[c].get(id);C[c].set(id,{data:Object.assign({},cur&&!cur.deleted?cur.data:{},JSON.parse(JSON.stringify(patch))),deleted:false});emit(c)};
  return {update:write,set:write,
    async delete(){await rpc('jp_delete',{...cred(),p_coll:c,p_id:id});const cur=C[c].get(id);if(cur){cur.deleted=true}emit(c)},
    onSnapshot(next){const s={c,sent:new Map(),first:true,next:snap=>{const d=snap.docs.length?null:null;
        const v=C[c].get(id);next(mkDoc(id,v&&!v.deleted?v.data:undefined))}};
      s.next=()=>{const v=C[c].get(id);next(mkDoc(id,v&&!v.deleted?v.data:undefined))};
      const st=JSON.stringify;let last='\u0000';
      const sub={c,sent:new Map(),first:true,next:()=>{const v=C[c].get(id);const cur=v&&!v.deleted?st(v.data):'';if(cur!==last){last=cur;next(mkDoc(id,v&&!v.deleted?v.data:undefined))}}};
      subs.push(sub);if(ready)setTimeout(()=>emit(c),0);return()=>{const i=subs.indexOf(sub);if(i>=0)subs.splice(i,1)}}}}
const db={collection:colRef,doc:docRef};
const userCap={id:async()=>NAME,can:async()=>true,isOwner:async()=>false,canEdit:async()=>true,
  profiles:async ids=>Object.fromEntries(ids.map(i=>[i,{id:i,name:i}])),me:async()=>({id:NAME,name:NAME})};
const dlCap={async save({filename,data}){const b=new Blob([data],{type:/\.csv$/.test(filename)?'text/csv;charset=utf-8':'text/html'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);return{status:'saved'}}};

let started=null;
function start(){if(!started){started=(async()=>{await ensureLogin();addAccountButtons();poll()})()}return started}
window.JPX={hist:(limit,before)=>rpc('jp_hist',{...cred(),p_limit:limit||200,p_before:before||null}),
  noHist:x=>NOFN(x),
  cached:(c,id)=>{const v=C[c]&&C[c].get(id);return v&&!v.deleted?v.data:null},
  get me(){return ME}};
window.claude={use:async n=>{await start();return n==='db'?db:n==='user'?userCap:n==='downloads'?dlCap:null}};
})();

</script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STAGE={'진행중':'--c-prog','대기':'--c-wait','재고대기':'--c-stock','단계완료':'--c-step','보류':'--c-hold','인쇄완료':'--c-print'};
const ORDER=['진행중','대기','단계완료','재고대기','보류','인쇄완료'];
const ORG=[
 ['출판1부',['차인태','신보용','권윤주','김지혜','김진영','박온누리','윤소연','백혜림','정지연','임한나','김예민'],'g1'],
 ['출판1부 한글편집팀',['유은아','김우진','이혜숙'],'g2'],
 ['출판2부',['이미향','김희현'],'g3'],
 ['디자인부',['이연주','김진혜','강현희','박지은','정은진','방지예'],'g4']];
const ORG_KNOWN=new Set(ORG.flatMap(g=>g[1]));
/* 작업자 칸 구분: 담당자(편집) / 디자이너(조판·디자인).
   저장 필드: editors(담당자 배열), designers(디자이너 배열), workers(둘을 합친 전체 — 권한·필터·작업자별 화면이 계속 이 값을 씀).
   예전 데이터(역할 필드 없음)는 한글편집팀·디자인부 = 디자이너, 그 밖의 명단 = 담당자, 명단에 없는 이름은 첫 번째면 디자이너·그 외 담당자로 추정해서 보여 줌 */
const DESIGN_SET=new Set(ORG.filter(g=>g[2]==='g2'||g[2]==='g4').flatMap(g=>g[1]));
const uniq=a=>[...new Set(a)];
function rolesOf(r){
  const ws=r.workers||[];
  if(Array.isArray(r.editors)||Array.isArray(r.designers)){
    const e=(Array.isArray(r.editors)?r.editors:[]).filter(n=>ws.includes(n)),d=(Array.isArray(r.designers)?r.designers:[]).filter(n=>ws.includes(n));
    return {editors:[...e,...ws.filter(n=>!e.includes(n)&&!d.includes(n))],designers:d}}
  const e=[],d=[];ws.forEach((n,i)=>(DESIGN_SET.has(n)||(!ORG_KNOWN.has(n)&&i===0)?d:e).push(n));return {editors:e,designers:d}}
/* 수정 권한(서버가 같은 규칙으로 다시 검사함): 관리자는 전부, 그 외는 작업자에 본인 이름이 있는 도서만 (작업자가 비어 있는 도서는 누구나) */
const SECS_DEFAULT=['진행 도서 · 개정','진행 도서 · 신간','권오수 선생님 모음','인천대산전기학원','환경'];
let SEC_LIST=null; /* 관리자가 저장한 구분 목록 (meta/sections) */
const allSecs=()=>[...new Set([...(SEC_LIST&&SEC_LIST.length?SEC_LIST:SECS_DEFAULT),...recs().map(r=>r.sec).filter(Boolean)])];
const col=s=>`var(${STAGE[s]||'--c-prog'})`;
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const hm=ms=>{const d=new Date(ms);return String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const ageOf=s=>s?Math.round((TODAY-new Date(s+'T00:00:00'))/864e5):null;
function autoStage(t){t=t||'';if(/인쇄\s?넘김/.test(t))return'인쇄완료';if(t.includes('보류'))return'보류';
  if(t.includes('재고')&&t.includes('대기'))return'재고대기';if(t.includes('대기'))return'대기';
  if(/중|中/.test(t))return'진행중';if(t.includes('완료'))return'단계완료';return'진행중'}
const kindOf=r=>{const v=(r.rev||'').replace(/[()\s]/g,'');return((r.sec||'').includes('신간')||v==='신'||v==='新'||v==='신간')?'신간':'개정'};

const SIN=/\((?:신|新)\)/g;
const revH=v=>esc(v).replace(SIN,'(<span class="sin">新</span>)');
const revT=v=>String(v??'').replace(SIN,'(新)');
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

/* ---------- 상태 ---------- */
let db=null,userCap=null,dlCap=null,myId=null,canWrite=false;
const M={books:new Map(),incoming:new Map(),memo:new Map(),hold:new Map(),meta:null};
const loaded={books:false,incoming:false,memo:false,hold:false,meta:false};
const st={q:'',sec:'',kind:'',worker:lsGet('jp-worker')||'',thr:14,hidePrint:true,onlyStale:false,edit:false,stages:new Set(),sort:{k:'date',dir:-1},sortTouched:false,myOrder:false};
let curTab='list';
const list=c=>[...M[c].values()].sort((a,b)=>(a.order??1e9)-(b.order??1e9));
const recs=()=>list('books');
const isStale=v=>v.age!=null&&v.age>=st.thr&&['진행중','대기','단계완료'].includes(v.stage);
/* 담당자별 진행 상황: 진행내용(pn_)·단계(ps_)·갱신일(pd_)·단계수동(pm_) 을 이름별로 따로 저장. 없으면 도서 공통값(note/stage/date)을 씀 */
const isAdmin=()=>!!(window.JPX&&window.JPX.me&&window.JPX.me.is_admin);
const mayBook=r=>canWrite&&(isAdmin()||!(r.workers||[]).length||(r.workers||[]).includes(myId));
const mayWorker=(r,w)=>canWrite&&(isAdmin()||(w?w===myId:mayBook(r)));
const pk=(w,f)=>'p'+f+'_'+w;
function eff(r,w){const g=(f,b)=>(w&&r[pk(w,f)]!==undefined)?r[pk(w,f)]:b;
  const date=g('d',r.date);return {note:g('n',r.note),stage:g('s',r.stage),date,manual:g('m',r.stageManual),age:ageOf(date)}}
function aggr(r){const ws=r.workers||[];if(ws.length<2)return eff(r,ws[0]||'');
  const es=ws.map(w=>eff(r,w));
  const stage=es.map(e=>e.stage).sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b))[0];
  const date=es.map(e=>e.date||'').sort().pop()||r.date;
  const same=es.every(e=>e.note===es[0].note);
  return {note:same?es[0].note:es.map((e,i)=>ws[i]+': '+(e.note||'-')).join(' / '),stage,date,age:ageOf(date),manual:false}}
const AG=r=>aggr(r);
const V=r=>st.worker&&(r.workers||[]).includes(st.worker)?eff(r,st.worker):aggr(r);
const wsOf=r=>st.worker?[st.worker]:((r.workers||[]).length?r.workers:['']);
function setF(r,w,vals){const personal=w&&((r.workers||[]).length>1||['n','s','d','m'].some(f=>r[pk(w,f)]!==undefined));
  const map={note:['n','note'],stage:['s','stage'],date:['d','date'],manual:['m','stageManual']};const fields=[];
  for(const k in vals){const key=personal?pk(w,map[k][0]):map[k][1];r[key]=vals[k];fields.push(key)}return fields}
const noteAll=r=>[r.note,...(r.workers||[]).map(w=>r[pk(w,'n')])].filter(Boolean).join(' ');
const mmdd=s=>s?s.slice(2).replace(/-/g,'.'):'-';
const ageTxt=v=>{if(v.age==null)return '<span class="age">상시</span>';
  return `<span class="${isStale(v)?'age old':'age'}">${mmdd(v.date)} · ${v.age}일 전</span>`};
const secShort=s=>(s||'').replace('진행 도서 · ','진행·');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),3500)}
function setSaved(msg,err){const e=$('#saved');e.textContent=msg;e.classList.toggle('err',!!err)}
const clone=v=>JSON.parse(JSON.stringify(v));

/* ---------- 쓰기 (필드 단위 저장, 문서당 한 번에 하나) ---------- */
function mark(coll,rec,fields){fields.forEach(f=>rec._d.add(f));clearTimeout(rec._t);setSaved('저장 중…');rec._t=setTimeout(()=>flush(coll,rec),600)}
async function flush(coll,rec){
  if(!db||!rec._d.size)return;
  if(rec._busy){rec._again=true;return}
  rec._busy=true;const f=[...rec._d];rec._d.clear();
  const patch={};f.forEach(k=>patch[k]=clone(rec[k]===undefined?'':rec[k]));
  const onlyOrd=f.every(k=>k.startsWith('wo_'));
  if(!onlyOrd){if(myId){patch.by=myId}patch.at=Date.now()}
  let failed=false;
  try{await db.doc(coll+'/'+rec.id).update(patch);if(!onlyOrd){rec.by=patch.by;rec.at=patch.at;renderRecent()}
    const n=new Date();setSaved('저장됨 '+String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'))}
  catch(e){failed=true;
    if(e&&e.code==='forbidden'){ /* 서버가 권한 없음으로 거부: 화면의 바뀐 값을 서버 값으로 되돌림 */
      const cd=window.JPX&&window.JPX.cached(coll,rec.id);
      f.forEach(k=>{if(cd&&k in cd)rec[k]=clone(cd[k]);else delete rec[k]});
      rec._d.clear();setSaved('저장 안 됨',true);toast('수정 권한이 없어 저장되지 않았습니다. (본인 담당 도서만 수정할 수 있습니다)');requestRender(true);return}
    f.forEach(k=>rec._d.add(k));
    setSaved('저장 실패',true);
    toast(e&&e.code==='invalid_argument'?'저장하지 못했습니다. 다른 사람이 삭제했거나 수정 권한이 없습니다.':'저장하지 못했습니다. 잠시 뒤 다시 수정해 주세요.')}
  finally{rec._busy=false;if(!failed&&(rec._again||rec._d.size)){rec._again=false;mark(coll,rec,[])}}
}
async function createDoc(coll,data){
  const id=(coll[0])+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  const rec={id,...data,_d:new Set()};M[coll].set(id,rec);

function ingest(coll,snap){
  snap.docChanges().forEach(ch=>{const id=ch.doc.id;
    if(ch.type==='removed'){M[coll].delete(id);return}
    const data=ch.doc.data()||{};let rec=M[coll].get(id);
    if(!rec){rec={id,_d:new Set()};M[coll].set(id,rec)}
    for(const k in data){if(!rec._d.has(k))rec[k]=(typeof data[k]==='object'&&data[k])?clone(data[k]):data[k]}
  });
  loaded[coll]=true;
}

  return [...ORG.flatMap(g=>g[1]).filter(w=>n.has(w)),...[...n].filter(w=>!ORG_KNOWN.has(w)).sort((a,b)=>a.localeCompare(b,'ko'))]};

      return `<div class="jr-it"><span class="jr-st" style="--c:${col(v.stage)}">${esc(v.stage)}</span><div class="jr-tt">${esc(r.title)}${r.rev?`<em>${revH(r.rev)}</em>`:''}</div>
       ${v.note?`<div class="jr-nt">${esc(v.note)}</div>`:''}${co.length?`<div class="jr-co">함께: ${esc(co.join(', '))}</div>`:''}</div>`}).join('');
    const going=x.going.length?`<details class="jr-on"><summary>계속 진행 중인 도서 ${x.going.length}건</summary>${x.going.map(([r,v])=>`<div class="o" style="--c:${col(v.stage)}"><i></i><b>${esc(r.title)}</b><span>${esc(v.stage)} · ${v.age==null?'상시':v.age+'일 전'}</span></div>`).join('')}</details>`:'';
    const op=can?`<label for="op-${esc(w)}">${w===myId?'내 의견·메모':esc(w)+' 의견·메모 (관리자 수정)'}<span class="jr-sv" data-k="${esc(D+'|'+w)}"></span></label><textarea class="jr-op" id="op-${esc(w)}" data-jw="${esc(w)}" rows="2" placeholder="오늘 업무에 대한 의견, 이슈, 내일 계획을 남겨 보세요" maxlength="3000">${esc(x.op)}</textarea><div class="op-p">${esc(x.op)}</div>`
      :(x.op.trim()?`<label>${esc(w)}의 의견·메모</label><div class="jr-ro op-p2">${esc(x.op)}</div><div class="op-p">${esc(x.op)}</div>`:'');
    return `<article class="jr-c${w===myId?' me':''}${(!x.done.length&&!x.op.trim())?' idle':''}" style="--gc:var(--${gc})"><div class="jr-ch"><span class="jr-av">${esc(w.slice(0,1))}</span><div class="jr-nm">${esc(w)}<small>${esc(gn)}</small></div><span class="jr-cnt${x.done.length?'':' z'}">${x.done.length?x.done.length+'건 갱신':'갱신 없음'}</span></div>
      <div class="jr-b">${items||'<div class="jr-none">'+(isNow?'오늘 갱신한 업무가 없습니다.':'이 날 갱신한 업무가 없습니다.')+'</div>'}${going}</div>
      ${op?`<div class="jr-opw${x.op.trim()?'':' empty'}">${op}</div>`:''}</article>`}).join('')
    :'<div class="jr-empty">표시할 내용이 없습니다. 위에서 “갱신 없는 사람도 보기”를 켜 보세요.</div>';
  document.querySelectorAll('#jrGrid .jr-op').forEach(t=>{t.style.height='auto';t.style.height=Math.max(64,t.scrollHeight+2)+'px'});
  if(keepFocus){const t=document.querySelector(`#jrGrid .jr-op[data-jw="${CSS.escape(keepFocus.w)}"]`);if(t){t.focus();try{t.setSelectionRange(keepFocus.s,keepFocus.e)}catch(e){}}}
  const now=new Date();
  $('#jrFoot').textContent=`${jrTitleOf(D).replace(/<[^>]+>/g,' ')} 업무일지 · 출력 ${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}${myId?' · 출력자 '+myId:''}`;
}
function jrOpen(){jr.scroll=window.scrollY;jr.on=true;jr.date=iso(TODAY);document.body.classList.add('jr-open');$('#jr').hidden=false;window.scrollTo(0,0);jrRender()}
function jrClose(){jr.on=false;document.body.classList.remove('jr-open');$('#jr').hidden=true;window.scrollTo(0,jr.scroll||0)}
const jrShift=n=>{const d=new Date(jr.date+'T00:00:00');d.setDate(d.getDate()+n);if(d>TODAY)return;jr.date=iso(d);jrRender()};
$('#bJr').onclick=jrOpen;$('#jrBack').onclick=jrClose;$('#jrPrint').onclick=()=>window.print();
$('#jrPrev').onclick=()=>jrShift(-1);$('#jrNext').onclick=()=>jrShift(1);$('#jrToday').onclick=()=>{jr.date=iso(TODAY);jrRender()};
$('#jrDate').onchange=e=>{if(e.target.value&&new Date(e.target.value+'T00:00:00')<=TODAY){jr.date=e.target.value;jrRender()}};
$('#jrWho').onchange=e=>{jr.who=e.target.value;jrRender()};$('#jrAll').onchange=e=>{jr.all=e.target.checked;jrRender()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&jr.on&&!document.activeElement.matches('textarea'))jrClose()});
const jrTimers={};
function jrSaveNow(D,w,text){const key=D+'|'+w;clearTimeout(jrTimers[key]);delete jrTimers[key];
  const sv=()=>document.querySelector(`.jr-sv[data-k="${CSS.escape(key)}"]`);
  const set=t=>{const el=sv();if(el)el.textContent=t};set('저장 중…');
  return db.doc('meta/log_'+D).update({['lg_'+w]:text}).then(()=>{const c=Object.assign({},LOGS.get(D)||{});c['lg_'+w]=text;LOGS.set(D,c);set('저장됨 '+new Date().toTimeString().slice(0,5))},
    e=>{set('저장 실패');toast('의견을 저장하지 못했습니다: '+(e&&e.message?e.message:'다시 시도해 주세요'))})}
document.addEventListener('input',e=>{const t=e.target.closest&&e.target.closest('.jr-op');if(!t)return;
  t.style.height='auto';t.style.height=Math.max(64,t.scrollHeight+2)+'px';
  const pp=t.parentElement.querySelector('.op-p');if(pp)pp.textContent=t.value;t.parentElement.classList.toggle('empty',!t.value.trim());
  const D=jr.date,w=t.dataset.jw,key=D+'|'+w;const sv=document.querySelector(`.jr-sv[data-k="${CSS.escape(key)}"]`);if(sv)sv.textContent='입력 중…';
  clearTimeout(jrTimers[key]);jrTimers[key]=setTimeout(()=>jrSaveNow(D,w,t.value),900)});
document.addEventListener('focusout',e=>{const t=e.target.closest&&e.target.closest('.jr-op');if(!t)return;
  const key=jr.date+'|'+t.dataset.jw;if(jrTimers[key])jrSaveNow(jr.date,t.dataset.jw,t.value)});
window.addEventListener('pagehide',()=>{Object.keys(jrTimers).forEach(k=>{const [D,w]=k.split('|');const t=document.querySelector(`.jr-op[data-jw="${CSS.escape(w)}"]`);if(t&&D===jr.date)jrSaveNow(D,w,t.value)})});

/* ---------- 작업자별 / 체크포인트 / 입고예정 / 보류 ---------- */
const WSTAGES=['진행중','대기','단계완료','재고대기','보류'];
const openSet=new Set();
function htmlWorkers(all){
  const byW={};
  recs().forEach(r=>{(r.workers||[]).forEach(w=>{if(eff(r,w).stage==='인쇄완료')return;(byW[w]=byW[w]||[]).push(r)})});
  const others=Object.keys(byW).filter(w=>!ORG_KNOWN.has(w)).sort((a,b)=>byW[b].length-byW[a].length||a.localeCompare(b,'ko'));
  const groups=[...ORG,['기타 (외주·미분류)',others,'gx']];
  const card=w=>{
    const mine=(byW[w]||[]);
    if(!mine.length)return `<div class="card idle"><h3><span class="w" data-w="${esc(w)}">${esc(w)}</span><span class="hr"><small>작업 0건</small> ${(!all&&canWrite&&(isAdmin()||w===myId))?`<button type="button" class="chip no-print" data-addfor="${esc(w)}">+ 도서</button>`:''}</span></h3><div class="lbl">진행 중인 작업이 없습니다</div></div>`;
    const by={};mine.forEach(r=>{const g=eff(r,w).stage;(by[g]=by[g]||[]).push(r)});
    const stages=WSTAGES.filter(x=>by[x]);
    const open=x=>all||openSet.has(w+'|'+x);
    return `<div class="card"><h3><span class="w" data-w="${esc(w)}">${esc(w)}</span><span class="hr"><small>작업 ${mine.length}건</small> ${(!all&&canWrite&&(isAdmin()||w===myId))?`<button type="button" class="chip no-print" data-addfor="${esc(w)}">+ 도서</button>`:''}</span></h3>
      <div class="mini">${stages.map(x=>`<button type="button" class="stbtn" style="--c:${col(x)}" data-tog="${esc(w+'|'+x)}" aria-expanded="${open(x)}">${x} ${by[x].length}</button>`).join('')}</div>
      ${stages.map(x=>`<div class="wstage${open(x)?' open':''}" data-k="${esc(w+'|'+x)}"><div class="shead">${x}</div>${by[x].sort((a,b)=>(eff(a,w).date||'')<(eff(b,w).date||'')?1:-1).map(r=>{const v=eff(r,w);return `<div class="item"><b>${esc(r.title)}</b> ${revH(r.rev)}
        <div class="n">${esc(v.note)} · ${ageTxt(v)}</div></div>`}).join('')}</div>`).join('')}</div>`};
  const html=groups.map(([n,members,gc])=>{
    if(!members.length)return '';
    const tot=members.reduce((t,w)=>t+(byW[w]||[]).length,0);
    return `<section class="wgroup ${gc}"><h2>${esc(n)} <small>${members.length}명 · 작업 ${tot}건</small></h2><div class="cards">${members.map(card).join('')}</div></section>`}).join('');
  return html||'<div class="empty">표시할 작업이 없습니다</div>'}
function renderWorkers(){$('#wcards').innerHTML=htmlWorkers()}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-tog]');
  if(b){const k=b.dataset.tog,card=b.closest('.card');const on=!openSet.has(k);on?openSet.add(k):openSet.delete(k);
    b.setAttribute('aria-expanded',on);const p=[...card.querySelectorAll('.wstage')].find(x=>x.dataset.k===k);if(p)p.classList.toggle('open',on);return}
  if(e.target.id==='wOpen'){document.querySelectorAll('#wcards .stbtn').forEach(x=>openSet.add(x.dataset.tog));renderWorkers();return}
  if(e.target.id==='wClose'){openSet.clear();renderWorkers()}});
const E=()=>st.edit&&isAdmin()?' contenteditable="plaintext-only"':'';
function htmlMemo(){return list('memo').map(g=>{
    const subs={};(g.items||[]).forEach((it,ji)=>(subs[it.label||'']=subs[it.label||'']||[]).push([ji,it.text]));
    return `<div class="card"><h3>${esc(g.title)}</h3>${Object.entries(subs).map(([l,xs])=>`${l?`<div class="lbl">[${esc(l)}]</div>`:''}<ul>${xs.map(([ji,x])=>`<li><span${E()} data-m="memo" data-g="${esc(g.id)}" data-j="${ji}">${esc(x)}</span></li>`).join('')}</ul>`).join('')}
      ${!(g.items||[]).length?'<div class="lbl">(기재 없음)</div>':''}</div>`}).join('')||'<div class="empty">내용이 없습니다</div>'}
function htmlInc(){return list('incoming').map(r=>`<tr>${['date','title','author','progress','rev'].map(f=>`<td${f==='title'?' class="t"':''}><span${E()} data-m="inc" data-id="${esc(r.id)}" data-f="${f}">${esc(r[f])}</span></td>`).join('')}<td class="act">${isAdmin()?`<button class="chip" data-incdel="${esc(r.id)}">삭제</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">입고 예정이 없습니다</td></tr>'}
function htmlHold(){return list('hold').map(g=>`<div class="card"><h3>${esc(g.title)}<small>${(g.items||[]).length}건</small></h3>${(g.items||[]).map((i,ji)=>`<div class="item"><span${E()} class="age" data-m="hold" data-g="${esc(g.id)}" data-j="${ji}" data-f="date">${esc(i.date)}</span> <span${E()} data-m="hold" data-g="${esc(g.id)}" data-j="${ji}" data-f="text">${esc(i.text)}</span></div>`).join('')}</div>`).join('')||'<div class="empty">내용이 없습니다</div>'}
function renderMisc(){$('#memo').innerHTML=htmlMemo();$('#inc').innerHTML=htmlInc();$('#hold').innerHTML=htmlHold()}
document.addEventListener('input',e=>{const el=e.target.closest('[data-m]');if(!el)return;const v=el.textContent.trim();const k=el.dataset.m;
  if(k==='memo'){const g=M.memo.get(el.dataset.g);if(!g)return;g.items[+el.dataset.j].text=v;mark('memo',g,['items'])}
  else if(k==='inc'){const r=M.incoming.get(el.dataset.id);if(!r)return;r[el.dataset.f]=v;mark('incoming',r,[el.dataset.f])}
  else if(k==='hold'){const g=M.hold.get(el.dataset.g);if(!g)return;g.items[+el.dataset.j][el.dataset.f]=v;mark('hold',g,['items'])}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-m]')){e.preventDefault();e.target.blur()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-incdel]');if(!b)return;
  if(b.dataset.arm){removeDoc('incoming',b.dataset.incdel);return}
  b.dataset.arm='1';b.textContent='정말 삭제';b.classList.add('on');
  setTimeout(()=>{if(b.isConnected){delete b.dataset.arm;b.textContent='삭제';b.classList.remove('on')}},3000)});
$('#bIncAdd').onclick=async()=>{const mx=Math.max(0,...list('incoming').map(r=>r.order||0));
  await createDoc('incoming',{date:'',title:'새 도서',author:'',progress:'',rev:'',order:mx+1});renderMisc();renderKpis()};

const todayTitle=()=>{const d=new Date();return '주간계획서 ('+d.getFullYear()+'년 '+String(d.getMonth()+1).padStart(2,'0')+'월 '+String(d.getDate()).padStart(2,'0')+'일)'};

  const keep=st.worker;closeHist();resetFilters();

window.addEventListener('jp-me',()=>requestRender(true));
function setEdit(on){st.edit=on&&canWrite;document.body.classList.toggle('edit',st.edit);
  $('#bEdit').classList.toggle('on',st.edit);$('#bEdit').textContent=st.edit?'편집 모드 끄기':'편집 모드';

$('#bEdit').onclick=()=>setEdit(!st.edit);
function dlFail(e){if(e&&e.code==='declined')return;toast('파일을 저장하지 못했습니다.')}
$('#bCsv').onclick=async()=>{if(!dlCap){toast('이 화면에서는 파일 저장을 쓸 수 없습니다');return}
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const rows=[['구분','도서명','차수','저자','담당자','디자이너','단계','최종갱신','진행내용']];
  filtered().forEach(r=>{const v=V(r);const ro=rolesOf(r);rows.push([r.sec,r.title,revT(r.rev),r.author,ro.editors.join(' / '),ro.designers.join(' / '),v.stage,v.date,v.note])});
  try{await dlCap.save({filename:'주간계획서_'+iso(new Date()).replace(/-/g,'')+'.csv',data:'﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n')})}catch(e){dlFail(e)}};
$('#bPrint').onclick=async()=>{

    $('#pMeta').textContent=$('#pMeta').textContent}
  else if(curTab==='worker')body=htmlWorkers(true);
  else if(curTab==='memo')body=`<div class="memo-grid">${htmlMemo()}</div>`;
  else if(curTab==='incoming')body=`<div class="tbl-wrap"><table><thead><tr><th>입고(예정)일</th><th>도서명</th><th>저자</th><th>현재 진행</th><th>차수</th></tr></thead><tbody>${htmlInc().replace(/<td class="act">.*?<\/td>/g,'')}</tbody></table></div>`;
  else body=`<div class="memo-grid">${htmlHold()}</div>`;
  st.edit=was;
  const css=$('#pagecss').textContent.replace('.panel{display:none}.panel.on{display:block}','');
  const doc=`<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(title)}</title><style>${css}

@media print{body{padding:0}}</style></head><body><div class="wrap"><div class="printhead"><h1>${esc(title)}</h1><div class="meta">${esc($('#pMeta').textContent)}</div></div>${body}</div>
<script>addEventListener('load',function(){setTimeout(function(){print()},400)})<\/script></body></html>`;
  try{await dlCap.save({filename:'주간계획서_인쇄용_'+iso(new Date()).replace(/-/g,'')+'.html',data:doc})}catch(e){dlFail(e)}};

(async()=>{
  const cl=window.claude;
  if(!cl||!cl.use){setConn('err','claude.ai에서 열어야 실시간 기능을 쓸 수 있습니다');return}

  if(!db){setConn('err','로그인 후 사용할 수 있습니다 (데이터를 불러올 수 없음)');loaded.books=true;render();return}
  if(userCap){try{myId=await userCap.id()}catch(e){}
    let cw=null;try{cw=await userCap.can('data.write')}catch(e){}
