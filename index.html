<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>주간계획서 뷰어</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2330;--sub:#5d6778;--line:#e1e5ec;--accent:#2457c5;--accent-bg:#e8effc;
--c-prog:#2457c5;--c-wait:#b7791f;--c-stock:#7a5fb0;--c-done:#2f855a;--c-step:#0f8a8a;--c-hold:#c0392b;--c-print:#8a93a3;--warn:#c0392b;--ok:#2f855a}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1a1f28;--ink:#e6e9ef;--sub:#99a3b3;--line:#2b323f;--accent:#7ea4f2;--accent-bg:#1f2b45;
--c-prog:#7ea4f2;--c-wait:#e0b050;--c-stock:#b79df0;--c-done:#6fcf97;--c-step:#58c6c6;--c-hold:#f08a7e;--c-print:#7d8696;--warn:#f08a7e;--ok:#6fcf97}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
header{padding:16px 20px 8px;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between}
h1{margin:0;font-size:20px}
.meta{color:var(--sub);font-size:12px;margin-top:2px}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:700}
.btn.danger{color:var(--warn)}
.saved{font-size:12px;color:var(--ok);min-width:8em;text-align:right}
.saved.err{color:var(--warn)}
.wrap{padding:0 20px 40px;max-width:1500px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.kpi:hover{border-color:var(--accent)}
.kpi b{display:block;font-size:22px;line-height:1.2}
.kpi span{font-size:12px;color:var(--sub)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0 12px;flex-wrap:wrap}
.tab{padding:8px 14px;border:0;background:none;color:var(--sub);font:inherit;cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:var(--accent);border-color:var(--accent);font-weight:700}
.panel{display:none}.panel.on{display:block}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.bar input[type=search],.bar select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.bar input[type=search]{min-width:220px;flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:3px 10px;border-radius:999px;font:inherit;font-size:12px;cursor:pointer}
.chip.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:700}
.lbl{font-size:12px;color:var(--sub)}
.count{margin:6px 2px;color:var(--sub);font-size:12px}
.editbanner{display:none;margin:0 0 10px;padding:8px 12px;border:1px solid var(--accent);background:var(--accent-bg);color:var(--accent);border-radius:8px;font-size:13px}
body.edit .editbanner{display:block}
.tbl-wrap{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;max-height:72vh}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 9px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:var(--card);font-size:12px;color:var(--sub);cursor:pointer;white-space:nowrap;z-index:1;border-bottom:2px solid var(--line)}
th.act,td.act{display:none;cursor:default;white-space:nowrap}
body.edit th.act,body.edit td.act{display:table-cell}
tr.r td:first-child{border-left:4px solid var(--c)}
tr.r:hover td{background:var(--accent-bg)}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;color:#fff;background:var(--c);white-space:nowrap}
.sec{font-size:11px;color:var(--sub)}
.t{font-weight:600}
td.nw{white-space:nowrap}
.age{font-size:11px;color:var(--sub);white-space:nowrap}
.age.old{color:var(--warn);font-weight:700}
.w{cursor:pointer;color:var(--accent)}
.w:hover{text-decoration:underline}
body.edit [contenteditable]{outline:1px dashed var(--line);border-radius:3px;padding:1px 4px;min-width:3ch;display:inline-block;max-width:100%}
body.edit [contenteditable]:focus{outline:2px solid var(--accent);background:var(--accent-bg)}
body.edit [contenteditable]:empty::before{content:'입력';color:var(--sub)}
td select,td input[type=date]{font:inherit;font-size:12px;padding:2px 4px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);max-width:100%}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.card h3{margin:0 0 6px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.card h3 small{color:var(--sub);font-weight:400}
.mini{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.item{padding:5px 0;border-top:1px dashed var(--line);font-size:13px}
.item .n{color:var(--sub);font-size:12px}
.memo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.card ul{margin:4px 0 0;padding-left:18px}
.card li{margin:2px 0}
.empty{color:var(--sub);padding:20px;text-align:center}
.note{font-size:12px;color:var(--sub);margin-top:14px;line-height:1.6}
.printhead{display:none}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:12px}
@page{size:A4 landscape;margin:10mm}
@media print{
  :root:root:root{--bg:#fff;--card:#fff;--ink:#000;--sub:#444;--line:#bbb;--accent:#1b3f94;--accent-bg:#fff;--c-prog:#2457c5;--c-wait:#b7791f;--c-stock:#7a5fb0;--c-done:#2f855a;--c-step:#0f8a8a;--c-hold:#c0392b;--c-print:#8a93a3;--warn:#c0392b}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{font-size:10px;background:#fff}
  header,.kpis,.tabs,.bar,.editbanner,.note,.no-print,.act{display:none!important}
  .wrap{padding:0;max-width:none}
  .panel{display:none!important}.panel.on{display:block!important}
  .printhead{display:block;margin-bottom:6px}
  .printhead h1{font-size:15px}
  .tbl-wrap{max-height:none;overflow:visible;border:0}
  th{position:static;cursor:default}
  tr{break-inside:avoid}
  th,td{padding:3px 5px}
  tr.r:hover td{background:none}
  .cards,.memo-grid{display:block;column-count:2;column-gap:10px}
  .card{break-inside:avoid;margin-bottom:8px}
  .w{color:inherit}
}
</style>
</head>
<body>
<header class="no-print">
  <div>
    <h1 id="ttl">주간계획서</h1>
    <div class="meta" id="meta"></div>
  </div>
  <div class="tools">
    <span class="saved" id="saved"></span>
    <button class="btn" id="bEdit">편집 모드</button>
    <button class="btn primary" id="bPrint">인쇄</button>
    <button class="btn" id="bCsv">CSV 저장</button>
    <button class="btn" id="bBackup">백업 저장</button>
    <button class="btn" id="bRestore">백업 불러오기</button>
    <input type="file" id="fileIn" accept="application/json,.json" hidden>
    <span id="resetBox"><button class="btn danger" id="bReset">원본으로 되돌리기</button></span>
  </div>
</header>
<div class="wrap">
  <div class="printhead"><h1 id="pTtl"></h1><div class="meta" id="pMeta"></div></div>
  <div class="kpis" id="kpis"></div>
  <div class="tabs" id="tabs"></div>
  <div class="editbanner">편집 모드입니다. 칸을 눌러 바로 고치세요. 변경 내용은 이 브라우저에 자동 저장됩니다. 작업자는 "이름 / 이름" 형식으로 적습니다.</div>

  <section class="panel" id="p-list">
    <div class="bar">
      <input type="search" id="q" placeholder="도서명·저자·작업자·진행내용 검색">
      <select id="fSec"></select>
      <select id="fKind"><option value="">신간+개정</option><option>신간</option><option>개정</option></select>
      <select id="fWorker"></select>
      <label class="lbl">정체 기준 <select id="thr"><option value="7">7일</option><option value="14" selected>14일</option><option value="30">30일</option></select></label>
      <label class="lbl"><input type="checkbox" id="hidePrint" checked> 인쇄완료 숨기기</label>
      <label class="lbl"><input type="checkbox" id="onlyStale"> 정체만</label>
      <button class="chip" id="reset">초기화</button>
      <button class="btn primary" id="bAdd" hidden>+ 도서 추가</button>
    </div>
    <div class="bar" style="padding:6px 10px"><span class="lbl">단계</span><div class="chips" id="stageChips"></div></div>
    <div class="count" id="count"></div>
    <div class="tbl-wrap"><table>
      <thead><tr>
        <th data-k="sec">구분</th><th data-k="title">도서명</th><th data-k="rev">차수</th><th data-k="author">저자</th>
        <th data-k="workers">작업자</th><th data-k="stage">단계</th><th data-k="date">최종 갱신</th><th>진행 내용</th><th class="act">삭제</th>
      </tr></thead>
      <tbody id="tb"></tbody>
    </table></div>
  </section>

  <section class="panel" id="p-worker"><div class="cards" id="wcards"></div></section>
  <section class="panel" id="p-memo"><div class="memo-grid" id="memo"></div></section>
  <section class="panel" id="p-incoming">
    <div class="bar no-print" id="incBar" hidden><button class="btn primary" id="bIncAdd">+ 입고예정 추가</button></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>입고(예정)일</th><th>도서명</th><th>저자</th><th>현재 진행</th><th>차수</th><th class="act">삭제</th></tr></thead><tbody id="inc"></tbody></table></div></section>
  <section class="panel" id="p-hold"><div class="memo-grid" id="hold"></div></section>

  <div class="note" id="note"></div>
</div>

    if(st.hidePrint&&r.stage==='인쇄완료'&&!st.stages.has('인쇄완료')&&!r._new)return false;
    if(st.stages.size&&!st.stages.has(r.stage))return false;
    if(st.sec&&r.sec!==st.sec)return false;
    if(st.kind&&r.kind!==st.kind)return false;
    if(st.worker&&!r.workers.includes(st.worker))return false;
    if(st.onlyStale&&!isStale(r))return false;
    if(st.q){const h=(r.title+r.author+r.workers.join(' ')+r.note+r.sec+r.rev+(r.extra||'')).toLowerCase();
      if(!st.q.split(/\s+/).every(t=>h.includes(t)))return false}
    return true});
  const {k,dir}=st.sort;
  const v=r=>k==='workers'?r.workers.join(','):k==='date'?(r.date||'9999'):k==='stage'?ORDER.indexOf(r.stage):(r[k]||'');
  a.sort((x,y)=>{const A=v(x),B=v(y);const c=(A<B?-1:A>B?1:0)*dir;if(c)return c;
    const d1=x.date||'9999',d2=y.date||'9999';return (d1<d2?-1:d1>d2?1:0)||x.i-y.i});
  return a}

/* ---------- 도서 목록 ---------- */
const ed=(f,id,v,cls)=>`<span ${st.edit?'contenteditable="plaintext-only"':''} data-f="${f}" data-id="${id}"${cls?` class="${cls}"`:''}>${esc(v)}</span>`;
function rowHtml(r){
  const id=r.i, c=col(r.stage);
  const secCell=st.edit
    ?`<select data-sel="sec" data-id="${id}">${[...new Set([...SECS,r.sec])].map(s=>`<option${s===r.sec?' selected':''}>${esc(s)}</option>`).join('')}</select>`
    :`<span class="sec">${esc(secShort(r.sec))}</span>`;
  const wk=st.edit?ed('workers',id,r.workers.join(' / '))
    :r.workers.map(w=>`<span class="w" data-w="${esc(w)}">${esc(w)}</span>`).join(' / ');
  const stg=st.edit
    ?`<select data-sel="stage" data-id="${id}">${ORDER.map(s=>`<option${s===r.stage?' selected':''}>${s}</option>`).join('')}</select>`
    :`<span class="badge" style="--c:${c}">${r.stage}</span>`;
  const dt=st.edit
    ?`<input type="date" data-date="1" data-id="${id}" value="${esc(r.date)}"> <span class="age-box">${ageTxt(r)}</span>`
    :ageTxt(r);
  return `<tr class="r" data-id="${id}" style="--c:${c}">
    <td>${secCell}${!st.edit&&r.extra?`<div class="sec">${esc(r.extra.split('|')[0])}</div>`:''}</td>
    <td class="t">${ed('title',id,r.title)}</td>
    <td class="nw">${ed('rev',id,r.rev)}</td>
    <td class="nw">${ed('author',id,r.author)}</td>
    <td>${wk}</td><td class="stg">${stg}</td><td class="dt">${dt}</td>
    <td>${ed('note',id,r.note)}${!st.edit&&r.extra&&r.extra.includes('|')?`<div class="sec">${esc(r.extra.split('|')[1])}</div>`:''}</td>
    <td class="act"><button class="chip" data-del="${id}">삭제</button></td></tr>`}
function render(){
  const a=filtered();
  $('#count').textContent=`${a.length}건 표시 (전체 ${recs.length}건) · 정체 기준 ${st.thr}일 · 헤더 클릭 시 정렬`;
  $('#tb').innerHTML=a.length?a.map(rowHtml).join(''):`<tr><td colspan="9" class="empty">조건에 맞는 도서가 없습니다</td></tr>`;
  document.querySelectorAll('#stageChips .chip').forEach(c=>c.classList.toggle('on',st.stages.has(c.dataset.s)));
  let f=[];if(st.q)f.push('검색 "'+st.q+'"');if(st.sec)f.push(st.sec);if(st.kind)f.push(st.kind);if(st.worker)f.push('작업자 '+st.worker);
  if(st.stages.size)f.push('단계 '+[...st.stages].join('·'));if(st.hidePrint&&!st.stages.has('인쇄완료'))f.push('인쇄완료 제외');if(st.onlyStale)f.push('정체만');
  $('#pMeta').textContent='인쇄일 '+iso(new Date())+' · 표시 '+a.length+'건'+(f.length?' · 조건: '+f.join(', '):'');
  renderKpis();
}
function renderKpis(){
  const act=recs.filter(r=>r.stage!=='인쇄완료');
  const n=s=>recs.filter(r=>r.stage===s).length;
  const K=[['작업 중 도서',act.length,()=>{st.hidePrint=true;st.stages.clear()}],
    ['진행중',n('진행중'),()=>{st.stages=new Set(['진행중'])}],
    ['대기',n('대기')+n('재고대기'),()=>{st.stages=new Set(['대기','재고대기'])}],
    ['정체 의심 ('+st.thr+'일+)',recs.filter(isStale).length,()=>{st.onlyStale=true;st.stages.clear()}],
    ['신간 진행',recs.filter(r=>r.kind==='신간'&&r.stage!=='인쇄완료').length,()=>{st.kind='신간';st.stages.clear()}],
    ['입고 예정',D.incoming.length,()=>showTab('incoming')]];
  $('#kpis').innerHTML=K.map((k,i)=>`<div class="kpi" data-k="${i}"><b>${k[1]}</b><span>${k[0]}</span></div>`).join('');
  document.querySelectorAll('.kpi').forEach(el=>el.onclick=()=>{const i=+el.dataset.k;
    if(i!==5){showTab('list');st.onlyStale=false;st.kind=''}
    K[i][2]();$('#onlyStale').checked=st.onlyStale;$('#fKind').value=st.kind;$('#hidePrint').checked=st.hidePrint;
    if(i!==5)render()})}

/* ---------- 인라인 편집 (목록) ---------- */
function touchRow(tr,r){
  tr.style.setProperty('--c',col(r.stage));
  const sel=tr.querySelector('select[data-sel=stage]');if(sel)sel.value=r.stage;
  const ab=tr.querySelector('.age-box');if(ab)ab.innerHTML=ageTxt(r);
}
const tb=$('#tb');
tb.addEventListener('input',e=>{
  const el=e.target.closest('[data-f]');if(!el)return;
  const r=byId(el.dataset.id);if(!r)return;const f=el.dataset.f,v=el.textContent;
  if(f==='workers')r.workers=v.split(/[\/,]/).map(s=>s.trim()).filter(Boolean);
  else r[f]=v.trim();
  if(f==='note'&&!r.stageManual)r.stage=autoStage(r.note);
  if(f==='rev')r.kind=kindOf(r);
  touchRow(el.closest('tr'),r);renderKpis();save()});
tb.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[contenteditable]')){e.preventDefault();e.target.blur()}});
tb.addEventListener('change',e=>{
  const t=e.target,id=t.dataset.id;if(!id)return;const r=byId(id);if(!r)return;
  if(t.dataset.sel==='stage'){r.stage=t.value;r.stageManual=true}
  else if(t.dataset.sel==='sec'){r.sec=t.value;r.kind=kindOf(r)}
  else if(t.dataset.date){r.date=t.value;r.age=ageOf(r.date)}
  touchRow(t.closest('tr'),r);renderKpis();save();drawSelects();});
tb.addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(!b)return;
  if(b.dataset.arm){recs=recs.filter(r=>r.i!==+b.dataset.del);save();wnames=drawSelects();render();return}
  b.dataset.arm='1';b.textContent='정말 삭제';b.classList.add('on');setTimeout(()=>{if(b.isConnected){delete b.dataset.arm;b.textContent='삭제';b.classList.remove('on')}},3000)});
$('#bAdd').onclick=()=>{
  resetFilters();
  const r={i:nextId++,sec:st.sec||'진행 도서 · 개정',title:'새 도서',author:'',workers:[],date:iso(TODAY),age:0,note:'',raw:'',rev:'',kind:'개정',stage:'진행중',extra:'',_new:1};
  recs.push(r);save();render();
  const el=tb.querySelector(`[data-f=title][data-id="${r.i}"]`);if(el){el.scrollIntoView({block:'center'});el.focus();document.getSelection().selectAllChildren(el)}};

/* ---------- 작업자별 ---------- */
function renderWorkers(){
  wnames=drawSelects();
  const html=wnames.map(w=>{
    const mine=recs.filter(r=>r.workers.includes(w)&&r.stage!=='인쇄완료').sort((a,b)=>(a.date||'9999')<(b.date||'9999')?-1:1);
    if(!mine.length)return '';
    const cnt={};mine.forEach(r=>cnt[r.stage]=(cnt[r.stage]||0)+1);
    return `<div class="card"><h3><span class="w" data-w="${esc(w)}">${esc(w)}</span><small>작업 중 ${mine.length}건</small></h3>
      <div class="mini">${ORDER.filter(s=>cnt[s]).map(s=>`<span class="badge" style="--c:${col(s)}">${s} ${cnt[s]}</span>`).join('')}</div>
      ${mine.map(r=>`<div class="item"><span class="badge" style="--c:${col(r.stage)}">${r.stage}</span> <b>${esc(r.title)}</b> ${esc(r.rev)}
        <div class="n">${esc(r.note)} · ${ageTxt(r)}</div></div>`).join('')}</div>`}).join('');
  $('#wcards').innerHTML=html||'<div class="empty">없음</div>';
}

/* ---------- 체크포인트 / 입고예정 / 보류 ---------- */
const E=()=>st.edit?' contenteditable="plaintext-only"':'';
function renderMisc(){
  $('#memo').innerHTML=D.memo.map((g,gi)=>{
    const subs={};g.items.forEach((it,ji)=>(subs[it.label||'']=subs[it.label||'']||[]).push([ji,it.text]));
    return `<div class="card"><h3>${esc(g.title)}</h3>${Object.entries(subs).map(([l,xs])=>`${l?`<div class="lbl">[${esc(l)}]</div>`:''}<ul>${xs.map(([ji,x])=>`<li><span${E()} data-m="memo" data-g="${gi}" data-j="${ji}">${esc(x)}</span></li>`).join('')}</ul>`).join('')}
      ${!g.items.length?'<div class="lbl">(기재 없음)</div>':''}</div>`}).join('');
  $('#inc').innerHTML=D.incoming.map((r,i)=>`<tr>${['date','title','author','progress','rev'].map(f=>`<td${f==='title'?' class="t"':''}><span${E()} data-m="inc" data-i="${i}" data-f="${f}">${esc(r[f])}</span></td>`).join('')}<td class="act"><button class="chip" data-incdel="${i}">삭제</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">입고 예정이 없습니다</td></tr>';
  $('#hold').innerHTML=D.hold.map((g,gi)=>`<div class="card"><h3>${esc(g.title)}<small>${g.items.length}건</small></h3>${g.items.map((i,ji)=>`<div class="item"><span${E()} class="age" data-m="hold" data-g="${gi}" data-j="${ji}" data-f="date">${esc(i.date)}</span> <span${E()} data-m="hold" data-g="${gi}" data-j="${ji}" data-f="text">${esc(i.text)}</span></div>`).join('')}</div>`).join('');
  drawTabs();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===curTab));
}
document.addEventListener('input',e=>{const el=e.target.closest('[data-m]');if(!el)return;const v=el.textContent.trim();
  if(el.dataset.m==='memo')D.memo[+el.dataset.g].items[+el.dataset.j].text=v;
  else if(el.dataset.m==='inc')D.incoming[+el.dataset.i][el.dataset.f]=v;
  else if(el.dataset.m==='hold')D.hold[+el.dataset.g].items[+el.dataset.j][el.dataset.f]=v;
  save()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-m]')){e.preventDefault();e.target.blur()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-incdel]');if(!b)return;
  if(b.dataset.arm){D.incoming.splice(+b.dataset.incdel,1);save();renderMisc();renderKpis();return}
  b.dataset.arm='1';b.textContent='정말 삭제';b.classList.add('on');setTimeout(()=>{if(b.isConnected){delete b.dataset.arm;b.textContent='삭제';b.classList.remove('on')}},3000)});
$('#bIncAdd').onclick=()=>{D.incoming.push({date:'',title:'새 도서',author:'',progress:'',rev:''});save();renderMisc();renderKpis()};

/* ---------- 편집 모드 / 인쇄 ---------- */
function setEdit(on){st.edit=on;document.body.classList.toggle('edit',on);
  $('#bEdit').classList.toggle('on',on);$('#bEdit').textContent=on?'편집 모드 끄기':'편집 모드';
  $('#bAdd').hidden=!on;$('#incBar').hidden=!on;render();renderMisc();if(curTab==='worker')renderWorkers()}
$('#bEdit').onclick=()=>setEdit(!st.edit);
let wasEdit=false;
window.addEventListener('beforeprint',()=>{if(st.edit){wasEdit=true;setEdit(false)}});
window.addEventListener('afterprint',()=>{if(wasEdit){wasEdit=false;setEdit(true)}});
$('#bPrint').onclick=()=>{refreshAges();render();window.print()};

/* ---------- 저장/불러오기/CSV/되돌리기 ---------- */
function download(name,text,type){const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const stamp=()=>iso(new Date()).replace(/-/g,'');
$('#bBackup').onclick=()=>download('주간계획서_백업_'+stamp()+'.json',JSON.stringify({sig:SIG,recs,incoming:D.incoming,memo:D.memo,hold:D.hold,nextId},null,1),'application/json');
$('#bRestore').onclick=()=>$('#fileIn').click();
$('#fileIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const s=JSON.parse(rd.result);if(!Array.isArray(s.recs))throw 0;
    recs=s.recs;D.incoming=s.incoming||[];D.memo=s.memo||[];D.hold=s.hold||[];nextId=s.nextId||Math.max(...recs.map(r=>r.i||0))+1;
    recs.forEach((r,i)=>{if(r.i==null)r.i=i});refreshAges();save();wnames=drawSelects();render();renderMisc();setSaved('백업을 불러왔습니다')}
    catch(x){setSaved('백업 파일을 읽을 수 없습니다',true)}};
  rd.readAsText(f);e.target.value=''};
$('#bCsv').onclick=()=>{const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const rows=[['구분','도서명','차수','저자','작업자','단계','최종갱신','진행내용']];
  filtered().forEach(r=>rows.push([r.sec,r.title,r.rev,r.author,r.workers.join(' / '),r.stage,r.date,r.note]));
  download('주간계획서_'+stamp()+'.csv','﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv;charset=utf-8')};
$('#bReset').onclick=()=>{$('#resetBox').innerHTML='<span class="confirm">수정한 내용이 모두 사라집니다. <button class="btn danger" id="rYes">되돌리기</button><button class="btn" id="rNo">취소</button></span>';
  $('#rYes').onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}location.reload()};
  $('#rNo').onclick=()=>location.reload()};

/* ---------- 시작 ---------- */
$('#ttl').textContent='주간계획서 (2026년 11월 09일)';$('#pTtl').textContent=$('#ttl').textContent;
$('#meta').textContent='원본: 주간계획서.hwp · 경과일은 오늘('+iso(TODAY)+') 기준 · 단계·정체 표시는 진행 내용 문구로 자동 분류됩니다 (단계는 직접 바꿀 수 있습니다)';
$('#note').innerHTML='※ 수정 내용은 이 컴퓨터의 이 브라우저에만 저장됩니다. 다른 사람과 공유되지 않으니, 보관·전달이 필요하면 "백업 저장"을 사용하세요. 단계 분류 규칙: "인쇄 넘김"→인쇄완료 / "보류"→보류 / "재고…대기"→재고대기 / "대기"→대기 / "중"→진행중 / "완료"→단계완료. 슬래시(/)로 구분된 작업자는 원문 순서대로 표기했으며 역할은 구분하지 않았습니다.';
if(restored)setSaved('이전 수정 내용을 불러왔습니다');
drawTabs();renderMisc();render();
const h=(location.hash||'#list').slice(1).replace(/[^a-z]/g,'');showTab(TABS.some(t=>t[0]===h)?h:'list');
</script>
</body>
</html>
